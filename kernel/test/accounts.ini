; ACCOUNTS: passwd, su and newgrp -- the three setuid-root programs of task C6.
;
; login.ini proved that a shell can belong to somebody other than root.  multi.ini proved that
; two of them can be alive at once.  This file is about the three commands that CHANGE who you
; are once you are there, and about the one file on this image that a user may rewrite.
;
; WHY IT IS A BOOT OF ITS OWN rather than more stages in multi.ini.  All three prompt through
; getpass(3), which opens /dev/tty -- so no grafted shell script can feed them and the
; characters have to be typed at a terminal, which is what this suite's .ini files are for.
; And passwd REWRITES /etc/passwd, so it wants an image whose password file nothing else is
; asserting.  multi.ini's dialogue is twelve stages of two-terminal sequencing already.
;
; WHAT IS HERE AND NOWHERE ELSE:
;
;   THE ISUID BRANCH TAKEN BY A COMMAND SOMEBODY TYPED.  cmd/README.md §8 records that
;   getxfile() honours the setuid bit only `if (u.u_uid != 0)', that every shell on this image
;   used to be root's, and that lib/test/suidt therefore had to drop to uid 7 on purpose to
;   reach that branch at all.  Stage 6 reaches it by accident, which is the point: guest types
;   `su', the bit fires because guest is not root, and the prompt comes back `# '.
;
;   A PASSWORD ROUND TRIP, which is the whole oracle for passwd and cannot be faked.  guest's
;   /etc/passwd field is EMPTY on this image, so stage 2 logs in with no prompt at all.  passwd
;   gives the account a password.  The session logs out, init respawns the getty, and stage 11
;   logs the same name in again -- and THIS TIME login asks for a password.  A prompt that did
;   not exist before, satisfied by a hash the guest computed itself, through crypt(3), against
;   a salt made of time() and getpid().  No stage asserts the hash: it is salted from the clock
;   and is different on every run, which is why the host side asserts its SHAPE.
;
;   TWO FILES WHOSE GROUPS DIFFER, which is newgrp's only visible effect and cannot be seen
;   from inside the guest at all (cmd/README.md, task C1: a mode and an owner are the host's to
;   assert).  /tmp/before is created by the login shell, gid 3; /tmp/after by a shell newgrp
;   moved to gid 1.  run-accounts.sh is the half that reads them back off the disk.
;
; THE PORT IS 4201.  login.ini listens on 4199 and multi.ini dials 4200; the RESOURCE_LOCK in
; CMakeLists.txt is what stops two of these running at once, and the fixed ports are half its
; reason.  Consul 2 is attached but never driven: init forks a getty on it either way, and an
; unattached line would discard what that getty prints (besm6_tty.c's vt_putc returns early on
; !t->conn), which costs nothing here but would make a stall harder to read.
;
; THE DISK IS A COPY AND IS WRITABLE, at volume 3098 -- the next free number after multi's
; 3085 and filters' 3097.  run-accounts.sh converts it fresh for every run, then fscks it,
; asks for the modes and unpacks /etc/passwd.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev and exece() stages the
; argument list there.  See boot.ini.in, which says it at length.
;
; EVERY `send' CARRIES `after=20000 delay=20000', both halves, for the reason login.ini's
; header states at length: a send issued straight out of an expect can lose its first
; character, and a getty reading RAW one read(2) per character can lose the second.  There are
; two RAW getty dialogues here, stages 1 and 10, because the session is entered twice.
;
; EVERY expect IS THE TAIL OF THE OUTPUT BEFORE IT.  SIMH CLEARS THE MATCH BUFFER WHEN A RULE
; FIRES (login.ini's stage 7 says so), and this file leans on that harder than any other:
; getpass() writes its prompt with no newline and then a bare "\n" when the reply is read, so
; several stages below match on nothing but "\r\n" and a prompt.  Each of those is safe
; ONLY because the rule before it emptied the buffer.  Never reorder them.
;
; A FAILURE IS TIMEOUT-SHAPED, deliberately.  Where it stopped is the diagnosis; look the PC up
; in ../unix.nm for the kernel or in build/rootfs/bin/{login,passwd,su,newgrp}.nm for userland.

reset
set cpu latin
set mmu cache
set tty25 raw8
set tty26 raw8

attach tty25 console
attach tty26 Line=26,4201
attach md00 root3098.disk
attach -n drum0 accounts0.drum
attach -n drum1 accounts1.drum
load ../unix

; 1 -- the single-user prompt; the only rule in this file that may match a bare prompt.
expect "# " send after=20000 delay=20000 "\004"; step 50000000

; 2 -- the tail of the date /etc/rc prints, then the getty's prompt.  Unique: nothing else in
;      the stream carries `GMT 2026', and the seconds are left out of the match.
expect "GMT 2026\r\n\r\nlogin: " send after=20000 delay=20000 "guest\r"; step 50000000

; 3 -- THE BASELINE, and it is an assertion by omission: guest's password field is empty, so
;      login goes straight from the echoed name to the motd with NO `Password:' between them.
;      If it ever asked, this rule would never fire -- which is the same statement stage 11
;      makes from the other side, after passwd has put a password there.
expect "guest\r\n\r\nБЭСМ-6 UNIX Version 7\r\n" echof "guest logged in with NO password prompt"; step 50000000

; 4 -- the last line of the motd, then uid 7's prompt (cmd/sh/main.c picks ps1 off getuid()).
expect "is here too.\r\n$ " send after=20000 delay=20000 "passwd\r"; step 50000000

; 5 -- passwd names the account from getlogin(), which is NOT getpwuid(getuid()): it reads the
;      /etc/utmp record for THIS TERMINAL, indexing by ttyslot().  So the no-argument form
;      works only because cmd/login wrote that record.  Then getpass()'s prompt, with no
;      newline -- and no `Old password:' before it, guest having had none.
expect "passwd\r\nChanging password for guest\r\nNew password:" send after=20000 delay=20000 "guestpw\r"; step 50000000

; 6 -- the reply is not echoed; getpass() writes the newline itself, having turned ECHO off
;      around the read.  `guestpw' is seven lower-case letters, which is what v7's own strength
;      rule wants: flags == 2 needs six characters or more.
expect "\r\nRetype new password:" send after=20000 delay=20000 "guestpw\r"; step 50000000

; 7 -- passwd copied /etc/passwd through /etc/ptmp with the hash replaced and copied it back
;      with creat(), there being no rename(2) here.  It prints nothing on success, so this
;      stage is getpass()'s last newline and the shell prompt -- safe only because stage 6
;      emptied the buffer.  v7 exited 1 here even when it had worked; this one exits 0.
expect "\r\n$ " send after=20000 delay=20000 "su\r"; step 50000000

; 8 -- THE ISUID BRANCH.  guest is uid 7, so getxfile() takes it and su runs as root; root's
;      /etc/passwd field is the DES hash of `root', whose plaintext lives in login.ini's header
;      and not on the image.
expect "su\r\nPassword:" send after=20000 delay=20000 "root\r"; step 50000000

; 9 -- `# ' is uid 0's prompt, and it is the shortest possible statement that a program a
;      GUEST typed became root.  Then out of it again with ^D.
;
;      IT HAS TO BE ^D AND NOT `exit', and that is a property of this shell rather than of
;      this test.  cmd/sh/error.c's exitsh() reads
;
;          if ((flags & (forked | errflg | ttyflg)) != ttyflg) done();
;          else { clearup(); longjmp(errshell, 1); }
;
;      -- so in an INTERACTIVE shell (ttyflg, not forked, no error) `exit' longjmps back to
;      the prompt and the shell goes on running.  That is v7's code unchanged, and it is why
;      every dialogue in this directory types ^D to leave a shell.  `exit' here costs a stage
;      that looks like a hang: the echo appears, then another prompt.
;
;      THE THREE STAGES FROM HERE MATCH A BARE PROMPT, which the header of login.ini warns
;      against in general and licenses here in particular: SIMH empties the match buffer when
;      a rule fires, ^D is not echoed, and so the prompt that arrives next is the only thing
;      in a fresh buffer.  Reordering them breaks that and nothing else will say so.
expect "\r\n# " send after=20000 delay=20000 "\004"; step 50000000

; 10 -- su's shell is gone and guest's own is back: `$ ', uid 7 again.  Then ^D once more --
;       THE LOGOUT.  The login shell exits, init's multiple() reaps it, rmut() blanks the
;       /etc/utmp record and dfork() starts a new getty on the same line.
expect "$ " send after=20000 delay=20000 "\004"; step 50000000

; 11 -- AND THE ROUND TRIP CLOSES.  The same name as stage 2, and this time there IS a
;       `Password:' -- because stage 5 put one in the file.  Nothing else in this suite asserts
;       that a write to /etc/passwd was read back by the program that reads /etc/passwd.
expect "\r\nlogin: " send after=20000 delay=20000 "guest\r"; step 50000000

; 12 -- and the hash guest computed satisfies crypt(3) on the way back in.
expect "guest\r\nPassword:" send after=20000 delay=20000 "guestpw\r"; step 50000000

; 13 -- logged in again, on the strength of a password this machine wrote for itself.
expect "is here too.\r\n$ " send after=20000 delay=20000 "echo x >/tmp/before\r"; step 50000000

; 14 -- THE CONTROL FILE, created by the login shell: uid 7, gid 3, which is what /etc/passwd
;       gives guest.  run-accounts.sh reads its group off the disk.
expect "/tmp/before\r\n$ " send after=20000 delay=20000 "newgrp sys\r"; step 50000000

; 15 -- REFUSED.  /etc/group has `sys::2:sys' and guest is not among its members, so newgrp
;       says Sorry -- and then execs a shell ANYWAY, with the group unchanged, because the
;       shell it was forked from is still waiting and a refusal that left the terminal without
;       one would be worse than the refusal.  That is v7 and newgrp.1 now says so.
expect "newgrp sys\r\nSorry\r\n$ " send after=20000 delay=20000 "newgrp other\r"; step 50000000

; 16 -- ALLOWED, and not because guest is a member: `other' is the group name v7 exempts from
;       the membership test outright, and it is gid 1 here.  setgid(2) to a group the caller is
;       not in passes only through suser(), which is the whole reason newgrp is setuid root --
;       and done() gives that back with setuid(getuid()) before it execs the shell.
expect "newgrp other\r\n$ " send after=20000 delay=20000 "echo x >/tmp/after\r"; step 50000000

; 17 -- the second file, and the only difference between it and the first is the group.  It
;       cannot be seen from here: `ls -l' prints an owner, and what changed is the other field.
expect "/tmp/after\r\n$ " send after=20000 delay=20000 "sync\r"; step 50000000

; 18 -- `sync', LAST.  There is no update daemon here, so without it the delayed-write buffers
;       holding the rewritten /etc/passwd, the two files in /tmp and /etc/utmp would still be in
;       core when the simulator stops, and the host-side half would see none of it.
expect "sync\r\n$ " echof "PASS: accounts -- guest logged in with no password, passwd gave the account one and rewrote /etc/passwd through /etc/ptmp, su took getxfile()'s ISUID branch from a shell a GUEST was typing at and came back root, the session logged out and logged in again ASKING for the new password, and newgrp moved a shell into a group guest is not a member of"; quit

; The machine has not run yet: every line above only ARMED a rule.  This is what starts it, and
; if any stage stalls it is also what runs out.
step 50000000

echof "FAIL: the accounts dialogue never completed -- the last expect never fired.  See accounts.ini for what each stage sends and expects, and remember that a stage's expect is the tail of the PREVIOUS stage's output and that several of them are nothing but a newline and a prompt, the buffer having been cleared by the rule before.  PC:"
ex PC
exit 1
