; THE TWENTY-FOUR TEXT FILTERS ON A RUNNING SYSTEM -- task C5's "done when".
;
; utils.ini is the model.  Where that one proves the small utilities do the things only a
; real kernel can show -- the clock, a delivered alarm, a signal -- this one closes the
; deferral task C5a wrote down: its six filters were asserted under b6sim ALONE, deliberately,
; because one two-minute boot was not worth taking for six programs that touch no device, no
; directory, no signal and no second process.  It is worth taking for twenty-four, and this is
; the boot: C5a's wc, cmp, sum, tee, split and rev, C5b's tr, uniq, comm, tail, od, look and
; col, C5c's grep and fgrep, C5d's sort, C5e's sed and C5f's pr, cal, tsort, join, file, diff
; and find, in one run.
;
; EIGHT THINGS HERE ARE UNREACHABLE UNDER b6sim and filters.sh's header lists them at length:
; look(1) against its default /usr/dict/words, which under the simulator would be the BUILD
; MACHINE's file; tail(1) on a PIPE, where the ESPIPE probe takes the branch that b6sim's
; always-a-file standard input cannot reach; col(1)'s two diagnostics, which name the program
; through argv[0] -- the staged build path under b6sim, and the word as typed here; a pattern,
; a separator or a whole script WITH A SPACE IN IT, which run-prog-test.sh's unquoted .args
; line cannot carry; a temp file or a w file in the image's own /tmp; THE WHOLE OF find(1),
; which has no b6sim half at all; file(1) over a real a.out, a directory and two device nodes;
; diff(1)'s temp file and its exec of /usr/lib/diffh; the sixteen PIPELINES between one filter
; and another; and, for C5a's six, that the image's copy runs at all, which the two `ls /bin'
; listings assert the existence of and not the execution of.
;
; It boots the same kernel with a WRITABLE copy of the root image, tells the shell to run
; /etc/filters (kernel/test/filters.sh), and stops when that script says it is finished.  The
; diff happens on the HOST afterwards; see run-filters.sh, of which this file is the middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in utils.ini, session.ini and files.ini.  What
; there is is the step budget, and for this script it is a real one: split(1) had an upstream
; bug that did not terminate on a zero count (cmd/README.md, task C5a), and a filter that
; loops forever on this image would hang the run rather than fail it.  The budget turns that
; into a failure with a diagnostic.
;
; THE DISK IS ATTACHED WITHOUT -r, because the script writes its whole corpus to /tmp -- the
; four here-documents, uniq's second output file, tee's two, split's three -- and syncs at the
; end.  root3097.disk is converted out of root.img by run-filters.sh, freshly for every run,
; with the script grafted in; root3072.disk, the build artifact, is never written by anything.
; Not `-n' either: that would CREATE AND FORMAT an empty container, on which sbcheck() would
; fail and the boot would panic.
;
; 3097 IS THIS TEST'S OWN VOLUME, and it is 3097 rather than the 3096 cmd/TODO.md named:
; mount grew a FOURTH pack after that was written -- 3093 root, 3094 scratch, 3095 the blank
; one it mounts to be refused and 3096 the second scratch NMOUNT 8 allowed -- so 3096 was
; taken by the time this was written.  3072 is the artifact, mdtest owns 3073-3076, session
; 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081, files 3082, utils 3083,
; login 3084, multi 3085, edit 3086, fsinfo 3087, dd 3088, mkfs 3089-3090, fsck 3091-3092 and
; mount 3093-3096.  The volume number is the rightmost run of digits in the filename;
; `attach' scrapes it, so the name IS the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the others want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.  The
; second matters more here than in most of these: half the assertions in filters.sh are about
; bytes above 0177 surviving, and a console that stripped the eighth bit would fail them all
; for a reason that has nothing to do with the filters.
;
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3097.disk
attach -n drum0 filters0.drum
attach -n drum1 filters1.drum
load ../unix

expect "# " send after=20000 delay=20000 "sh /etc/filters\r"; step 400000000
expect "filters done" echof "PASS: filters -- the shell ran /etc/filters, which put all twenty-four of task C5's text filters through the booted kernel. What only a boot can say: look searched the image's own /usr/dict/words, tail branched on ESPIPE down a real pipe, col named itself in its diagnostics, grep and sort and sed took a pattern, a separator and a whole script WITH A SPACE in them, sort and sed and diff wrote into the image's own /tmp and left nothing behind, file named a real BESM-6 a.out by its FMAGIC and RELFLG and called a line of Russian text rather than data, diff EXECed /usr/lib/diffh for -h, find walked a tree it built for itself -- which is the whole of what is asserted about find anywhere -- C5a's six executed off the disk at last, and sixteen pipelines ran between them"; quit

step 400000000

echof "FAIL: /etc/filters never finished -- it either never started or never reached its last line. Anything the script printed before stopping is above, and /tmp/filters.log on the pack holds whatever reached it. The likeliest cause is a filter that did not terminate: task C5a found one in split(1) (a zero count made its per-piece loop zero-trip and it went round forever), and a filter that hangs on this image exhausts this budget rather than failing. See filters.sh for what it does, and run-filters.sh for what happens to the disk afterwards. PC:"
ex PC
exit 1
