; THE FILE-MANAGEMENT SET ON A REAL FILESYSTEM -- task C1b's "done when".
;
; session.ini proved that a shell can create and write files; this one proves that cp, ln, mv
; and rm can rearrange them.  It boots the same kernel with a WRITABLE copy of the root image,
; tells the shell to run /etc/files (kernel/test/files.sh), and stops when that script says it
; is finished.  Everything that matters then happens on the HOST -- run-files.sh converts the
; container back to a flat image, fscks it, extracts it, and diffs what the script wrote.
; See run-files.sh; this file is only the middle of it.
;
; SO THERE IS ALMOST NO ASSERTION HERE, and that is deliberate, exactly as in session.ini.
; `files done' says the script ran to its end, nothing more.  The question this test really
; asks -- did mv's four-call re-parent leave the link counts right -- is a question about the
; disk, and it is asked with a five-pass fsck where it can be answered properly.
;
; THE DISK IS ATTACHED WITHOUT -r, which is the point of the test and is why it is a COPY.
; root3082.disk is converted out of root.img by run-files.sh, freshly for every run, with the
; script grafted in; root3072.disk, the build artifact, is never written by anything.  Not
; `-n' either: that would CREATE AND FORMAT an empty container, on which sbcheck() would fail
; and the boot would panic.  3082 is this test's own volume -- 3072 is the artifact, mdtest
; owns 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080 and swap
; 3081.  The volume number is the rightmost run of digits in the filename; `attach' scrapes
; it, so the name IS the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  This test execs more than any other: every
; command in the script, and a /bin/rmdir per directory that `rm -r' removes.  They are named
; for this test because ctest runs the SIMH tests in parallel and the others want swap areas
; of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
; `step', not `go': a hang must fail the run instead of hanging it.  The step counts are
; larger than session's because this script runs some seventy programs rather than a dozen --
; task C1c's chmod/chown/chgrp/touch block added about thirty of them, and the count had to
; go up with it or the test fails as `never reached its last line' rather than as a hang.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3082.disk
attach -n drum0 files0.drum
attach -n drum1 files1.drum
load ../unix

expect "# " send after=20000 delay=20000 "sh /etc/files\r"; step 400000000
expect "files done" echof "PASS: files -- the shell ran /etc/files, which copied, linked, renamed, removed, and then changed a mode, an owner and a time"; quit

step 400000000

echof "FAIL: /etc/files never finished -- it either never started or never reached its last line. A PC in the kernel with the step count run out means it hung; anything the script printed before stopping is above. See files.sh for what it does, and run-files.sh for what happens to the disk afterwards. PC:"
ex PC
exit 1
