; The console as a CONTROLLING TERMINAL, and the shell that sits on it -- tasks 23 and 25b.
;
; boot.ini next door proves the kernel gets to a prompt: process 1 execs /etc/init, init forks
; /bin/sh, and the shell writes `# '.  This one has a conversation with that shell.  It boots
; the same image, waits for the prompt, TYPES AT IT, and checks what comes back -- and every
; line now goes through a real fork/exec of a real command, where the coninit dialogue this
; replaced was one hand-written program answering with a canned echo.
;
; That is the only way to reach the top half of the terminal code.  sctest drives the same
; Consul, but from a standalone image with no kernel underneath -- it reaches the `ext'
; instructions and stops there.  What runs only here is scintr() -> ttyinput() -> canon(),
; the erase/kill/EOF processing, the ECHO path back out through ttyoutput()/ttstart(), the
; clists that carry all of it (kernel/prim.c), and the /dev/tty indirection in dev/sys.c.
;
; HOW THE DIALOGUE IS DRIVEN.  SIMH `expect' watches the console output and fires an action
; when a string appears; `send' injects keystrokes.  On the input side the console line goes
; through sim_poll_kbd(), which serves injected characters BEFORE it looks at the real
; keyboard -- so this works under ctest with no tty on stdin, which is the whole point.  An
; expect that fires HALTS the simulator, so each action ends with its own `step' to restart
; it; the run is therefore bounded by wall clock (the ctest TIMEOUT) rather than by one step
; budget.  All the rules are armed before the machine starts and any of them can fire; a rule
; is removed once it has matched, which is what keeps the prompts apart.
;
; EVERY `send' CARRIES `after=20000', AND THAT IS NOT DECORATION.  A send issued straight out
; of an expect starts delivering the moment the machine is stepped again, and its FIRST
; character can be lost: `rmdir /tmp/d' arrived as `mdir /tmp/d' on EVERY run of this file --
; reproducible, not occasional -- until the delay went in, and the dialogue stalled there.
; 20000 cycles before the first character is enough and costs nothing measurable.  Put it on
; any new stage too.
;
; WHAT WAS NOT ESTABLISHED is where the character goes.  The shape of it fits an input
; overrun -- scintr() (dev/sc.c) takes ONE character per ПРП interrupt out of a single
; register, so a second arriving before the first is read has nowhere to wait -- but that was
; not measured, and it may equally be an artifact of resuming a halted simulator.  Anyone who
; chases it should start by removing this `after=' and reproducing the drop, which is easy.
;
; EVERY PROMPT LOOKS THE SAME, `# ', so no rule may match the bare prompt except the first.
; Each later expect is therefore the TAIL OF THE PREVIOUS STAGE -- the end of the echoed input,
; then the command's output, then the next prompt -- which is unique per stage and cannot fire
; early.  Get one of those strings wrong and the run does not misbehave, it stalls, and the
; FAIL at the bottom says where.
;
; THE LAST RULE IS SUBJECT TO THAT RULE TOO, and used to break it: it was a bare `# ', matching
; the fresh prompt /etc/rc leads back to.  All the rules are armed at once and a rule fires when
; it is the first still-armed rule to match, so once ANY stage stalled -- the dropped first
; character above was doing exactly that -- the bare `# ' matched the very next prompt and the
; run printed PASS on a dialogue that had gone wrong.  THAT IS HOW THE DROPPED CHARACTER WENT
; UNNOTICED: this test was passing without ever running its last four stages.  The rule is
; `GMT 2026\r\n\r\nlogin: ' now -- the tail of the date /etc/rc prints, then what comes next --
; and nothing else in the stream carries it, nor has it any field the clock can move.  Never
; end this file on a rule that a bare prompt satisfies.
;
; WHAT COMES NEXT CHANGED WITH TASK 29b, and this is the one stage of the file that is about
; init rather than about the terminal.  It used to be another `# ': /etc/ttys was not on the
; image, so merge() returned at the failed open, multiple() found no children and fell straight
; through, and main() looped round to single() and a fresh single-user shell.  /etc/ttys is
; there now, so merge() forks an /etc/getty per line and multiple() STAYS -- the single-user
; prompt does not come back, and what appears instead is the login: this file ends on.  Logging
; in is kernel/test/login's business, not this one's; what is asserted here is only that the
; cycle reached multi-user at all.
;
; A COMMAND THAT PRINTS NOTHING is matched by ITS OWN ECHO plus the prompt, since there is no
; output to be the tail of: `mkdir /tmp/d\r\n# ' is the whole of that stage.  Three stages
; below are of that shape, and the two `ls /tmp' stages are told apart only by the `d' that
; the first one lists and the second does not -- so the LAST of them, whose directory is
; empty, is the one whose string is bare echo and prompt.  Check any new stage against every
; earlier stage's stream, not just against its neighbour: all the rules are armed at once.
;
; NO SWITCHES ON THE expects, and `-c' in particular would be a bug here: SIMH's `-c' is
; CLEARALL -- discard every other rule once this one matches -- not "compare literally", as
; the summary in doc/Simh_Simulator.md used to say.  A bare `expect' already matches the
; quoted byte string exactly; `-r' is what asks for a regular expression.
;
; WHAT EACH LINE TESTS, and why a wrong kernel cannot pass:
;
;   echo ab#c  -> echoed as typed, the shell receives `echo ac' and prints `ac'.  `#' is
;              CERASE (sys/tty.h): ttyinput() echoes it like any other character -- this is a
;              PRINTING terminal, there is no backspace-erase -- and canon() drops it together
;              with the `b' when it moves the raw queue to the canonical one.  A clist that
;              loses or duplicates characters, or an erase that does not erase, changes what
;              the shell is handed and so what comes back.
;
;   x@echo yz  -> echoed as typed plus a newline, the shell receives `echo yz' and prints
;              `yz'.  `@' is CKILL, and ttyinput() adds the newline itself (tty.c, the ECHO
;              arm) so the abandoned line does not run into the next one.
;
;   48 chars-> echoed and delivered whole.  This one is about the CLISTS, not the line
;              discipline: CBSIZE is 30 (sys/param.h), so a line this long is the only
;              stage that CHAINS BLOCKS -- putc() taking a second one from cfreelist,
;              getc() handing the first one back, in the raw queue, the canonical queue
;              and the output queue alike.  The short lines above never leave the first
;              block, and the pointer arithmetic that used to do this bookkeeping could not
;              work on this machine at all (see kernel/prim.c).  Keep a stage longer than
;              CBSIZE here.
;
;   >/dev/tty  -> `tty ok' arrives having been written through /dev/TTY, opened by the shell's
;              redirection in a FORKED CHILD -- so it only appears if syopen()/sywrite()
;              (dev/sys.c) resolved u.u_ttyd back to this same terminal across a fork.  The
;              coninit dialogue reached /dev/tty too, but from a hand-written syscall in the
;              process that already owned the terminal.
;
;   pwd        -> `/'.  pwd walks UP through the filesystem's own directory format, reading
;              `..' at each step (cmd/pwd/pwd.c); b6sim can never run it, since there is no
;              filesystem under b6sim at all.
;
;   ls /bin    -> every command on the image, one per line, sorted.  ls is the program that reaches
;              furthest into this kernel of anything on the image: opendir, stat per entry,
;              and /etc/passwd for the uid.  It is also the assertion that the image is the
;              one this build staged -- add a command to root.manifest and this line changes.
;              `[' comes first because it really is a directory entry and ASCII 0133 sorts
;              before every lower-case letter: it is /bin/test's second name, the one hard
;              link on this image (task C2b, cmd/test/README.md).
;
;   mkdir,     -> a directory made, listed, removed, and the listing empty again.  These are
;   rmdir         the first stages here that CHANGE the filesystem, and the first that run a
;              SETUID program (../../root.manifest, mode 04755) -- though not the setuid PATH:
;              this shell is root, and getxfile() honours ISUID only for a caller that is not
;              (kernel/sys1.c), so what a transition costs is asserted in lib/test/suidt.c
;              instead.  What these four stages are about is the directory itself: mknod, the
;              two link()s that put `.' and `..' in it, ls reading it back, and the three
;              unlink()s that take it apart -- with the parent's link count going up and down
;              underneath.  Nothing is sync'd, and nothing needs to be: this disk is a scratch
;              copy nobody looks at afterwards, and the run that DOES fsck what it wrote is
;              kernel/test/session.
;
;   ^D         -> nothing echoed, and read() returns 0.  \004 is CEOT = tun.t_eofc:
;              ttyoutput() drops it rather than echo it, canon() drops it from the line, so
;              a line consisting of just ^D delivers no characters at all -- which is what
;              end of file IS on a v7 terminal.  The shell leaves its command loop there and
;              exits, and THAT is what the last two stages are really about: init wakes from
;              its wait(), runs /etc/rc through a second shell, the date appears, and then
;              merge() reads /etc/ttys and puts a getty on each Consul.  Nothing else
;              in this suite covers the walk from single-user through process 1 into multi-user.
;              There used to be a third stage here, `One troff at a time' -- /etc/rc cat'd
;              /etc/motd to the console, and no longer does: login(1) prints the motd once
;              per session, so the console was getting it twice.  See etc/rc.  The date is
;              the assertion that the script ran, and it is a better one, being a value.
;
; THIS IS THE ONLY TEST THAT REACHES /etc/rc, which is why the boot script's own assertions
; live here rather than next door.  /etc/rc does not run until the first shell has exited
; (cmd/init/init.c: shutdown, single, runcom, multiple), and boot.ini quits on the first
; prompt -- with md00 still attached read-only, which is an assertion of its own.  session,
; files, libtest, swap and utils all type their script at that first prompt and quit too.
;
; AND WHY THE DATE IS A LITERAL.  This machine has no clock-calendar (include/sys/param.h),
; so main.c's iinit() seeds `time' from the root superblock's s_time, and b6fsutil stamps
; that with -T ROOTTIME -- 1784967780, 2026-07-25 08:23:00 GMT (kernel/test/CMakeLists.txt,
; and fstest.c asserts the same number).  So `date' in /etc/rc prints
; `Sat Jul 25 08:23:0X GMT 2026' on every build.  The expect stops just short of the seconds,
; which are the one field the boot drift can move: a whole run advances the guest clock about
; two seconds and 08:23:00 is 37 seconds clear of a minute roll, so the margin is ample --
; but if it were ever crossed the fix is to shorten the match to `Sat Jul 25 ', NOT to move
; ROOTTIME, which fstest pins.  There is no host-side stream here to sed the seconds out of,
; as run-utils.sh does; truncating the match is the same projection by other means.
;
; A FAILURE IS A TIMEOUT-SHAPED THING, deliberately: whatever goes wrong -- a dropped
; character, an erase that does not erase, a read that never wakes, a /dev/tty that opens
; onto nothing, a command that dies -- leaves the last expect unfired and the final `step'
; runs out, which is what the FAIL at the bottom reports.  Where it stopped is the diagnosis:
; look the PC up in ../unix.nm (kernel) or in the command's .nm under build/rootfs.
;
; AND IF THE DIAGNOSIS IS NOT OBVIOUS, BISECT WITH coninit.  It is still built next door
; (kernel/test/CMakeLists.txt) and is the only user program here that links neither crt0 nor
; libc.  Graft it onto a scratch copy as /etc/init -- `cp root.img bisect.img; b6fsutil -a
; bisect.img /etc/init coninit; b6fsutil -S --volume=3079 bisect.img root3079.disk' -- and its
; `line> ' loop is back with nothing but the kernel underneath it.  If that works and this
; does not, the fault is in the shell, in libc or in the commands, not in the terminal path.
;
; WHAT THIS TEST DOES NOT REACH, so that nobody reads a PASS as covering it: the output
; queue never grows past TTHIWAT, so ttwrite()'s ASLEEP/wakeup arm and ttyblock()'s ^S/^Q
; flow control are untouched; nothing sends CINTR or CQUIT, so the signal arm of ttyinput()
; and flushtty() are untouched; and although several processes now open the terminal, they
; all inherit it, so the process-group half of ttyopen() is still only ever taken once.
;
; `set tty25 raw8' is load-bearing on BOTH sides.  Out, the bytes go untranslated so expect
; sees the ASCII the kernel emitted.  In, vt_fix() passes CR and DEL through unchanged
; instead of folding CR to ETX -- so the kernel's CRMOD is the only thing turning a typed
; CR into a newline, which is exactly what dev/sc.c's header says it must be.  A raw8 line
; is also eight bits wide and computes no parity, which is what carries UTF-8 over this
; line at all; kernel/test/multi is where that is asserted, on the motd login prints.
;
; THE DISK IS A COPY, AND IS WRITABLE.  root3078.disk is converted out of root.img by the
; console_setup fixture in kernel/test/CMakeLists.txt, fresh for every run.  Not `-r' -- the
; mkdir stage really does write, and even before it did, an i_atime write-back forced by
; buffer pressure must not land on a read-only unit and put an `md' error message into the
; very stream these expects are matching.  And not `-n', which would CREATE AND FORMAT an
; empty container that sbcheck() then rejects.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and boot.ini wants a swap area of its own.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3078.disk
attach -n drum0 console0.drum
attach -n drum1 console1.drum
load ../unix

expect "# " send after=20000 "echo ab#c\r"; step 50000000
expect "\r\nac\r\n# " send after=20000 "x@echo yz\r"; step 50000000
expect "\r\nyz\r\n# " send after=20000 "echo 0123456789abcdefghijklmnopqrstuvwxyz0123456789ab\r"; step 50000000
expect "\r\n0123456789abcdefghijklmnopqrstuvwxyz0123456789ab\r\n# " send after=20000 "echo tty ok >/dev/tty\r"; step 50000000
expect "\r\ntty ok\r\n# " send after=20000 "pwd\r"; step 50000000
expect "\r\n/\r\n# " send after=20000 "ls /bin\r"; step 50000000
expect "\r\n[\r\nbasename\r\ncat\r\nchgrp\r\nchmod\r\nchown\r\ncp\r\ndate\r\ndd\r\ndf\r\ndu\r\necho\r\ned\r\nkill\r\nln\r\nlogin\r\nls\r\nmkdir\r\nmv\r\npwd\r\nrm\r\nrmdir\r\nsh\r\nsleep\r\nsync\r\ntest\r\ntime\r\ntouch\r\ntty\r\nyes\r\n# " send after=20000 "mkdir /tmp/d\r"; step 50000000
expect "mkdir /tmp/d\r\n# " send after=20000 "ls /tmp\r"; step 50000000
expect "\r\nd\r\n# " send after=20000 "rmdir /tmp/d\r"; step 50000000
expect "rmdir /tmp/d\r\n# " send after=20000 "ls /tmp\r"; step 50000000
expect "ls /tmp\r\n# " send after=20000 "\004"; step 50000000
expect "Sat Jul 25 08:23:" step 50000000
expect "GMT 2026\r\n\r\nlogin: " echof "PASS: console -- a shell prompt typed at over /dev/console, erase, kill and ^D honoured, a line longer than a clist block carried whole, /dev/tty opened by a forked child, pwd and ls run off the disk, a directory made and removed by the two setuid commands, and ^D took init round through /etc/rc -- which printed the boot date -- and on into MULTI-USER, where the first getty is already prompting"; quit

step 50000000

echof "FAIL: the console dialogue never completed -- the last expect never fired. See console.ini for what each stage sends and expects, and remember that a stage's expect is the tail of the PREVIOUS stage's output plus the next prompt. PC:"
ex PC
exit 1
