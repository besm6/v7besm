; CORE -- a user program run by the real kernel: kernel task 34, the `int'-vs-pointer sweep.
;
; boot.ini next door proves the kernel reaches a shell prompt and stops there.  This one types one
; command at that prompt: /usr/test/coret, which is lib/test/coret.c and whose header is the account
; of what it asserts.  Two things, both of them about an address the KERNEL FABRICATED OUT OF AN
; INTEGER and neither reachable any other way:
;
;   THE CORE DUMP.  core() (kernel/sig.c) wrote the user's image through `u_base = 0'.  A bare
;   `(caddr_t)<int>' is a bit copy, not a conversion -- the marker stays clear and the byte field
;   reads 0, which is BYTE #5, a word's last -- so the base stood out of phase with the kernel
;   buffer and the FIRST 3072-byte chunk went to disk five bytes over.  Only the first: iomove()
;   walks the base with `u.u_base += n' and the walked value is well formed.  So the head of every
;   core image was garbage and the rest was perfect, which is why nothing noticed.  coret dies on
;   SIGABRT and reads its own core file back at two places, one inside that chunk and one past it.
;
;   ptrace's ip_addr.  Nothing in this tree had ever called ptrace(2) -- no adb, no sdb -- so the
;   unit of its third argument was written down nowhere and procxmt()'s casts were right only by
;   assumption.  It is a WORD address (doc/Unix_V7_System_Calls.md section 4), and coret is what
;   holds it to that: it pokes a word into a stopped child and lets the CHILD read it back with its
;   own instructions, so the value never returns by the path it went out on.
;
; WHY THIS IS A SIMH TEST AND NOT A libtest CASE.  Neither arm exists under b6sim: it has no core
; dump at all, and it refuses ptrace with EPERM.  The two bugs the sweep started from were found by
; the image-side runner that used to execute /usr/test/* under a booted kernel, and that runner is
; deleted -- so a program that needs one gets a .ini of its own.  coret is the only entry in
; lib/test/progs.cmake with one.
;
; THE DISK IS A COPY AND IS WRITABLE, at volume 3086 -- this test's own; 3072 is the build artifact,
; mdtest owns 3073-3076, 3079 is the scratch volume this file's neighbour documents for a coninit
; bisection, and multi has 3085.  root3072.disk is never written by anything.  Not `-n', which would
; CREATE AND FORMAT an empty container on which sbcheck() fails.  coret writes its core file in /tmp
; (mode 0777) rather than /usr/test/scratch, which root.manifest keeps empty on purpose.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the argument
; list there before it touches the new image.  See boot.ini.in, which says it at length.  Named for
; this test because ctest runs the SIMH tests in parallel and each wants a swap area of its own.
;
; `set mmu cache' for the reason boot.ini.in gives, and `raw8' so the Consul is a byte pipe.
;
; EACH `expect' IS THE TAIL OF THE OUTPUT BEFORE IT, and every stage is reached only by matching
; what the one before printed -- an expect with an action ARMS a rule and returns, so the `; step'
; at the end of each line is part of that ACTION.  What starts the machine is the lone `step' at the
; foot of the file, and what keeps it going is each rule restarting it.  A rule that fires halts the
; machine, so the run is bounded by the ctest TIMEOUT rather than by one step budget.
;
; THE MIDDLE RULE IS THE ASSERTION.  coret prints `FAIL <what>' for a verdict that did not hold and
; `ok   <what>' for one that did, then `coret done' last however it went -- so matching `coret done'
; only says it finished.  What says it PASSED is that no line beginning `FAIL' was printed, and that
; is the rule armed before it: expect fires on the first match, so a FAIL anywhere in the run
; reaches its rule before `coret done' reaches the next one.
;
; `sync' LAST.  There is no update daemon here, so without it the delayed-write buffers would still
; be in core when the simulator stops and run-core.sh's fsck would see a filesystem mid-write.
;
; A FAILURE THAT IS NOT A `FAIL' LINE IS TIMEOUT-SHAPED, deliberately: where it stopped is the
; diagnosis.  Look the PC up in ../unix.nm for the kernel, or in build/lib/test/coret.nm if the
; program itself faulted -- a core() that faults while dumping a core is a plausible way to get
; there.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3086.disk
attach -n drum0 core0.drum
attach -n drum1 core1.drum
load ../unix

; 1 -- the single-user prompt, and the only rule here that may match a bare prompt.
expect "# " send after=20000 delay=20000 "/usr/test/coret\r"; step 200000000

; 2 -- any verdict that did not hold, armed BEFORE the completion rule so that it wins.  The
;      simulator stops here and the transcript above it names which one.
expect "\r\nFAIL" echof "\r\nFAIL: coret -- a verdict did not hold.  The line above names it and lib/test/coret.c says what it means.  `it is in phase' is core()'s u_base (kernel/sig.c); a ptrace verdict is procxmt() or the ABI in doc/Unix_V7_System_Calls.md section 4."; exit 1

; 3 -- the program's own last line.
expect "coret done" send after=20000 delay=20000 "sync\r"; step 200000000

; 4 -- and the buffers on the platter.
expect "sync\r\n# " echof "PASS: core -- the kernel dumped a core image at byte #0 of word 0 and ptrace reached a stopped child by word address"; quit

; The machine has not run yet: every line above only ARMED a rule.  This is what starts it, and if
; any stage stalls it is also what runs out.
step 200000000

echof "FAIL: coret never finished -- the last expect never fired.  If nothing was printed at all the exec of /usr/test/coret failed; if the verdicts stop part way, the program faulted where they stop.  PC:"
ex PC
exit 1
