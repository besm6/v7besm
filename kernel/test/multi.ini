; MULTIUSER: two people logged in at once, on the two Consul-254 typewriters -- kernel task 29c.
;
; boot.ini next door ends where this one begins.  That file proves the kernel reaches a shell
; prompt; it stops there, in SINGLE-USER mode, with /etc/rc unrun and no getty anywhere.  This is
; the only test in the tree that goes the rest of the way -- ^D out of the single-user shell,
; /etc/rc, init's merge() reading /etc/ttys and forking a getty per line, crypt(3) checking a
; password against /etc/passwd, login chown()ing its terminal and dropping privilege, and
; multiple() waiting to respawn.  All of that is on trial here, and nowhere else.  On top of it:
;
;   BOTH LINES ARE DRIVEN.  root logs in on /dev/console and guest on /dev/tty1, and neither logs
;   out, so at the end of the run TWO DIFFERENT UIDS OWN TWO TERMINALS AT THE SAME INSTANT.  That
;   is the assertion run-multi.sh makes on the host, and no single session can forge it: login
;   chown()s its terminal before it drops root and init's dfork() chown()s it back to 0/0 on every
;   respawn, so 0/1 on /dev/console and 7/3 on /dev/tty1 at once means two live sessions.
;
;   THEY TALK TO EACH OTHER.  guest's shell writes /tmp/two and root's shell cats it.  One
;   process on each typewriter, one filesystem between them -- which is the thing a second
;   terminal is FOR, and the only place in this suite with two shells alive at once.
;
;   /etc/rc IS ASSERTED, BOTH LINES OF IT (task C20).  Stage 3 matches the date it prints, and
;   stage 12 asks `ps -ax' for the update daemon it starts -- the only proof anywhere that the
;   boot script does anything at all, this being the only surviving test that runs it.
;
;   THE OPERATOR TYPES THE DATE (task C21).  Stage 1 runs ../date.ini at the single-user
;   prompt and stage 1b matches the year back, which is the only assertion anywhere that
;   stime(2) moves the clock on the real kernel -- kernel/test/utils held it and is deleted.
;   Every later stage that names a year names THAT one, so the file has no year in it.
;
;   AND A JOB IS SCHEDULED AND RUN (task C21).  Stages 13 to 17 spool an at(1) job, read its
;   name back out of /usr/spool/at, run /usr/lib/atrun and wait for the job's own output.
;   That chain is the only test of either program: atrun reads a DIRECTORY and names the
;   image's absolute paths, so b6sim cannot host it (cmd/README.md §9).
;
;   THE TRANSCRIPT OF CONSUL 2.  Everything /dev/tty1 printed is written to a file by
;   test/ttyhost.c and diffed against multi.expected.  Consul 1's stream is asserted here, by
;   expect; Consul 2's has no other oracle at all.
;
; HOW CONSUL 2 IS CONNECTED, AND WHY IT IS THE SIMULATOR THAT DIALS OUT.  A Consul line is a
; terminal only while a client is attached -- vt_putc()/vt_puts() in besm6_tty.c return early on
; !t->conn, so an unattached line discards what the guest prints to it, silently.  LISTENING
; (`attach tty26 Line=26,4200') is right for a human with a telnet client, but not for a script:
; the accept happens in tmxr_poll_conn(), which is polled at most once per second of HOST time,
; and measured here it lands about a second after `go' -- AFTER init's merge() has forked the
; getty on /dev/tty1 and after that getty has printed its prompt into the void.  Turning it round
; removes the race rather than papering over it.  test/ttyhost binds the port BEFORE the simulator
; is started, `Connect=' opens the connection when this file is parsed, i.e. before `go', and the
; first poll of the run completes it -- long before the root is mounted.  See ttyhost.c's header
; for the rest.
;
; IT NEEDS A SIMULATOR NEW ENOUGH TO TYPE AT A MUX LINE AT ALL.  besm6_tty.c's vt_getc() used to
; test only TMXR_VALID, the tag tmxr_getc_ln() puts on a character that came off the SOCKET; a
; character injected by `send TTY:n,"..."' carries SCPE_KFLAG instead, and was dequeued and then
; dropped -- so `send' on any BESM-6 mux line was a silent no-op, which is why no test had ever
; typed at Consul 2 and why the fix is in the simulator rather than here.  Take the fix out and
; this file stalls at stage 6, with the getty prompt in multi.tty1 and nothing typed back.
;
; AND `Line=26,' IS NOT DECORATION.  `attach tty26 4200' does NOT bind line 26: tty_attach() passes
; the string to tmxr_attach() with the comment "the unit number is ignored for the port
; assignment", so it makes a MUX-WIDE endpoint and tmxr_poll_conn() gives the connection to the
; lowest free line -- line 1, a bit-serial line this guest has no driver for.  The simulator says
; which line it gave it to (`*** tty26: a new connection'), and that is the way to check.
;
; THE ORDER IS THE ASSERTION, AND IT IS CARRIED BY THE CHAIN OF RULES.  Everything below is armed
; before the machine runs a single instruction -- an `expect' command with an action arms a rule
; and returns; the `; step' at the end of each line is part of that ACTION, not a command of its
; own, so what actually starts the machine is the lone `step' at the foot of the file and what
; keeps it going is each rule restarting it.  (sim_set_expect() takes the whole rest of the line
; as the action string; a BARE `send' here would be issued at parse time, before the boot, which
; is exactly the mistake this note exists to prevent.)  So the file cannot say "now do this":
; every stage is reached only by matching the output of the one before, and where the two
; terminals have to be sequenced that match is on the OTHER line --
;
;   stage 5   root's shell prompt, on the console, is what types `guest' at Consul 2.  guest
;             therefore logs in with root already at a prompt, which is what makes the two
;             sessions concurrent rather than merely consecutive.
;   stage 8   guest's prompt after the redirect, at Consul 2, is what types `cat' on the console.
;             root reads the file only once guest's shell says it is written.
;
; Between those two hand-overs exactly one terminal is ever talking, which is deliberate: the
; other one printing while its rule was not yet armed is the failure mode this arrangement has.
;
; EVERY `send' CARRIES `after=20000 delay=20000', both halves.  Two bugs made it necessary and both
; are fixed (../TODO.md task 35): SIMH's CONSUL_IN is one character deep and consul_receive()
; overwrote it whether or not the guest had read it, so a send issued straight out of an expect
; could lose its first character; and a getty reading RAW takes one read(2) per character, which
; is where the second went.  The delays stay because nobody has re-measured whether they are still
; needed, and there are two RAW gettys in this dialogue rather than one.
;
; EVERY expect IS THE TAIL OF THE OUTPUT BEFORE IT, and must be unique in ITS OWN stream -- the
; console and line 26 have separate match buffers, so a rule on one never sees the other's output.
; The last rule carries the echo of `sync', a command that appears nowhere else.  Never end this
; file on a rule a bare prompt satisfies.
;
; THE DISK IS A COPY AND IS WRITABLE, at volume 3085 -- this test's own; kernel/test/CMakeLists.txt
; has the numbering.  run-multi.sh converts it fresh for every run, then fscks it and asks for the
; modes.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev and exece() stages the argument
; list there.  See boot.ini.in, which says it at length.
;
; A FAILURE IS TIMEOUT-SHAPED, deliberately.  Where it stopped is the diagnosis; look the PC up in
; ../unix.nm for the kernel or in build/rootfs/{etc/getty,bin/login}.nm for userland.  If Consul 2
; is the thing in doubt rather than the dialogue, multi.tty1 in the build directory is what it
; actually printed, banners and all -- an empty one means the connection never came up and nothing
; below could have worked.

reset
set cpu latin
set mmu cache
set tty25 raw8
set tty26 raw8

attach tty25 console
attach tty26 Line=26,Connect=127.0.0.1:4200;notelnet
attach md00 root3085.disk
attach -n drum0 multi0.drum
attach -n drum1 multi1.drum
load ../unix

; 1 -- the single-user prompt; the only rule in this file that may match a bare prompt.  The
;      operator types the date here, which is what every stage below that names a year needs:
;      ../date.ini is the action, and its header says why it is a file rather than a send.
expect "# " do ../date.ini step 50000000

; 1b -- the clock MOVED.  date prints after it sets, so this is the only assertion anywhere
;       that stime(2) works on the real kernel -- kernel/test/utils held it and was deleted.
;       One %, not two: an expect PATTERN is substituted when this file is read.
expect "GMT %DATE_YYYY%\r\n# " send after=20000 delay=20000 "\004"; step 50000000

; 2 -- Consul 2's getty, the first thing this port has ever printed to a connected second
;      terminal.  merge() forks it together with the console's, so this fires about when stage 3
;      does; nothing is typed back yet.  An action's commands are PUSHED AHEAD of whatever is
;      already pending rather than replacing it (sim_brk_setact), so two rules matching at once
;      cost nothing -- which is the only reason a rule on the other line is safe here at all.
expect TTY:26,"login: " echof "tty1: a getty is prompting on the second Consul"; step 50000000

; 3 -- the tail of the date /etc/rc prints, then the console getty's prompt.  The year is the
;      one stage 1 set, and the seconds are left out of the match because they move.
expect "GMT %DATE_YYYY%\r\n\r\nlogin: " send after=20000 delay=20000 "root\r"; step 50000000

; 4 -- getty's own RAW echo of the name, then login's getpass prompt.  The password is `root' and
;      is NOT on the image: /etc/passwd carries its DES hash (`.8Y/JOGhfuk1I'), and what this stage
;      and the next therefore assert is that crypt(3) on this machine reproduces it.
expect "root\r\nPassword:" send after=20000 delay=20000 "root\r"; step 50000000

; 5 -- the last line of /etc/motd, printed by showmotd(), then uid 0's prompt -- AND THE HAND-OVER.
;      guest is typed at Consul 2 from here, so that it logs in with root already at a shell.
expect "is here too.\r\n# " send TTY:26,after=20000 delay=20000 "guest\r"; step 50000000

; 6 -- guest's password field is empty, so there is no prompt at all: straight to the motd and to
;      `$ ', which is uid 7's prompt (cmd/sh/main.c picks it off getuid()).  Two shells now, at two
;      privilege levels, on two typewriters.
expect TTY:26,"is here too.\r\n$ " send TTY:26,after=20000 delay=20000 "tty\r"; step 50000000

; 7 -- guest names its terminal.  ttyname(3) matches by I-NUMBER, which is why /dev/tty1 answers
;      with its own name rather than /dev/console's -- root.manifest gives the three nodes three
;      inodes for exactly this, and stage 11 is the other arm of it.
expect TTY:26,"/dev/tty1\r\n$ " send TTY:26,after=20000 delay=20000 "echo hello from tty1 >/tmp/two\r"; step 50000000

; 8 -- guest's shell has written a file -- /tmp is mode 0777, which is what lets uid 7 create one
;      there -- AND THE SECOND HAND-OVER: root reads it only now.
expect TTY:26,"/tmp/two\r\n$ " send after=20000 delay=20000 "cat /tmp/two\r"; step 50000000

; 9 -- one filesystem between two typewriters, which is what a second terminal is FOR.
expect "\r\nhello from tty1\r\n# " send after=20000 delay=20000 "ls -l /dev/console /dev/tty1\r"; step 50000000

; 10 -- both owners in one listing, resolved to names through /etc/passwd (cmd/ls).
;
;       THE TIMESTAMP IS NOT MATCHED, and must not be.  The mtime is the image's own -T stamp,
;       2026-07-25, while the clock is now the host's real one -- and ls prints the YEAR
;       instead of the time once a file is more than six months old (cmd/ls/ls.c).  So the
;       field this line used to carry changes shape on a date, and matching it would arm a
;       failure for 2027-01-25.  The owners are asserted off the disk by run-multi.sh, which
;       is the half that was always load-bearing.
expect "/dev/tty1\r\n# " send after=20000 delay=20000 "tty\r"; step 50000000

; 11 -- and the console names itself.
expect "/dev/console\r\n# " send after=20000 delay=20000 "ps -ax | grep updat\r"; step 50000000

; 12 -- THE DAEMON /etc/rc STARTED, and the only assertion this port has that the boot script
;       does anything but print a date (task C20).  The line reads `     6 0   0:00 update':
;       the name is the u-area's u_comm, and one sync() at HZ 250 rounds to 0:00.  Only the
;       name is matched -- the pid depends on how many processes the boot made.  `-x' IS
;       REQUIRED: update has no process group and is root's, which is exactly the row
;       cmd/ps/ps.c skips without it.
;
;       THE PATTERN IS TYPED ONE LETTER SHORT ON PURPOSE.  The console echoes what is typed,
;       so `grep update' would put ` update\r\n' into this stream before grep ran; with no
;       daemon grep prints nothing, the prompt follows the echo, and the expect below would
;       match the ECHO and assert nothing.  `updat' cannot: only grep's output can produce
;       ` update\r\n# ', so an absent daemon stalls the stage and fails the test.
;
;       If this ever stalls with the daemon plainly running, look for `<swapped>': ps prints
;       that instead of the name when the u-area is out (kernel/kctl.c), and a swapped-out
;       update would match nothing.  sched() gets there only after a swapin() fails for want
;       of core, which this dialogue does not do.
expect " update\r\n# " send after=20000 delay=20000 "ps -ax | grep cro\r"; step 50000000

; 12b -- THE SECOND DAEMON /etc/rc STARTS (task C22), and everything stage 12 says applies
;        here unchanged: `-x' is required because cron has no process group either, and the
;        pattern is typed one letter short so the echo of `grep cro' cannot satisfy it.  No
;        other process this dialogue makes is named anything containing `cro'.
;
;        NOTHING WAITS FOR CRON TO RUN ANYTHING.  The live crontab line fires at minutes 0, 5,
;        10 ..., and the guest clock is CALIBRATED to the host's rather than fast, so a stage
;        waiting for it would turn this whole five-second dialogue into a five-minute one.
;        cmd/cron/README.md has the by-hand check instead.
;
;        AND THAT SCHEDULE IS WHY STAGES 13 TO 17 HAVE A RACE: cron forks /usr/lib/atrun on
;        those same boundaries, so a run landing between stage 14 spooling the job and stage
;        16 typing atrun would collect it early and stall stage 15 or 17.  It needs these five
;        seconds to straddle a multiple of five minutes AND the boundary to fall in the half
;        second between the two; a one-off failure there is this and not a regression.
expect " cron\r\n# " send after=20000 delay=20000 "echo 'echo AT${z}RAN >/dev/console' >/tmp/j\r"; step 50000000

; 13 -- THE JOB, and the same echo trap as stage 12 dodged a different way.  The console
;       echoes what is typed, so the marker this dialogue waits for must be one the typing
;       cannot produce: the FILE says AT${z}RAN and the OUTPUT says ATRAN, z being unset.
expect ">/tmp/j\r\n# " send after=20000 delay=20000 "at 0000 jan 1 /tmp/j\r"; step 50000000

; 14 -- 00:00 on 1 January is in the past, so the job is due the moment it is spooled.  at
;       prints nothing when it works.
expect "jan 1 /tmp/j\r\n# " send after=20000 delay=20000 "echo /usr/spool/at/*\r"; step 50000000

; 15 -- THE FOUR-DIGIT YEAR, which is what task C21 actually fixed.  v7 named the spool file
;       with %02d of tm_year -- 126 in 2026, three characters -- and atrun read %2d back, so
;       every job was skipped in silence.  `echo' rather than `ls' because no column layout
;       can move it.  One % in the pattern, as in stage 1b.
expect "%DATE_YYYY%.000.0000." echof "at: the job is spooled under a four-digit year"; step 50000000

; 16 -- the tail of that same line.
expect "/usr/spool/at/past\r\n# " send after=20000 delay=20000 "/usr/lib/atrun\r"; step 50000000

; 17 -- THE JOB RAN: atrun parsed the name, linked it into past/, dropped to its owner and
;       handed it to /bin/sh.  The redirection is the job's own -- atrun gives it /dev/null
;       on all three descriptors, which is why at(1) says output is lost unless redirected.
;       NOT anchored on a prompt: atrun's parent returns at once, so this can land on either
;       side of one.
expect "ATRAN\r\n" send after=20000 delay=20000 "cd /tmp; echo '%DATE_MM%/%DATE_DD% CAL'OK >calendar\r"; step 50000000

; 18 -- THE REMINDER SERVICE (task C23), and the first of two forms.  A one-line ./calendar for
;       TODAY, written with the same %DATE_MM% and %DATE_DD% stage 1 typed at the clock, so the
;       assertion needs no idea of what day it is.  THE MONTH IS ZERO-PADDED and that is the
;       point: v7's pattern took a leading zero on the day and not on the month, and this line
;       would be missed for eleven months of the year without the port's one deviation.
;       The marker is broken by a quote for the same reason stage 13 spells AT${z}RAN: the
;       console echoes what is typed, so `CAL'OK' cannot satisfy an expect for CALOK.
expect ">calendar\r\n# " send after=20000 delay=20000 "calendar\r"; step 50000000

; 19 -- /usr/bin/calendar is a SHELL SCRIPT with no `#!' line, so this is also the only place
;       anything asserts that exec's ENOEXEC sends the shell back to read a file itself.  Three
;       programs answer between the prompt and this match: sh, /usr/lib/calendar and egrep -f.
expect "CALOK\r\n# " send after=20000 delay=20000 "echo '%DATE_MM%/%DATE_DD% MAI'OK >/usr/guest/calendar\r"; step 50000000

; 20 -- THE FULL-SERVICE FORM, which is what /usr/lib/crontab runs at 01:20.  A DIFFERENT marker
;       from the one above, so the match below cannot be satisfied by anything already printed.
expect "/usr/guest/calendar\r\n# " send after=20000 delay=20000 "calendar -\r"; step 50000000

; 21 -- it prints nothing when it works: the letter is the output.  guest is the only one of the
;       six lines of /etc/passwd with a readable $HOME/calendar -- root's and daemon's home is
;       `/', and sys, bin and uucp have homes this image has not got.
expect "calendar -\r\n# " send after=20000 delay=20000 "grep MAI'OK' /usr/spool/mail/guest\r"; step 50000000

; 22 -- AND THE LETTER ARRIVED.  cmd/mail/README.md's "What this harness cannot say" opens with
;       `that a letter ever arrives' -- task C28 checked delivery by hand and left it unasserted,
;       and this is the line that asserts it: sed walked /etc/passwd, egrep matched, and mail
;       wrote /usr/spool/mail/guest.
expect "MAIOK\r\n# " send after=20000 delay=20000 "sync\r"; step 50000000

; 23 -- `sync', LAST.  The daemon above syncs every thirty seconds and thirty seconds of guest
;       time need not pass here, so this is the flush that is DETERMINISTIC: without it the
;       delayed-write buffers holding /etc/utmp and the two terminals' new ownership would
;       still be in core when the simulator stops, and the host-side half would see none of it.
expect "sync\r\n# " echof "PASS: multiuser -- the operator typed the date and the clock took it, /etc/rc ran and left /etc/update running, a getty came up on each Consul, root logged in on /dev/console and guest on /dev/tty1 AT THE SAME TIME, each shell named its own terminal, root's shell read the file guest's shell wrote, an at(1) job was spooled and run by /usr/lib/atrun, and calendar(1) printed today's reminder and mailed guest his own"; quit

; The machine has not run yet: every line above only ARMED a rule.  This is what starts it, and
; if any stage stalls it is also what runs out.
step 50000000

echof "FAIL: the two-terminal dialogue never completed -- the last expect never fired.  See multi.ini for what each stage sends and expects; remember that a stage's expect is the tail of the previous output IN ITS OWN STREAM, and that multi.tty1 holds everything Consul 2 printed.  PC:"
ex PC
exit 1
