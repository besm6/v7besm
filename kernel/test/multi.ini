; MULTIUSER: two people logged in at once, on the two Consul-254 typewriters -- kernel task 29c.
;
; login.ini next door ends where this one begins.  That file proved the machine is multi-user in
; the sense that /etc/ttys is read, a getty is forked per line, crypt(3) checks a password and
; init's multiple() respawns the getty when the login shell goes -- but it typed at ONE terminal,
; Consul 1, and left the getty on /dev/tty1 waiting for a client that never came.  What is here
; and nowhere else:
;
;   BOTH LINES ARE DRIVEN.  root logs in on /dev/console and guest on /dev/tty1, and neither logs
;   out, so at the end of the run TWO DIFFERENT UIDS OWN TWO TERMINALS AT THE SAME INSTANT.  That
;   is the assertion run-multi.sh makes on the host, and no single session can forge it: login
;   chown()s its terminal before it drops root and init's dfork() chown()s it back to 0/0 on every
;   respawn, so 0/1 on /dev/console and 7/3 on /dev/tty1 at once means two live sessions.
;
;   THEY TALK TO EACH OTHER.  guest's shell writes /tmp/two and root's shell cats it.  One
;   process on each typewriter, one filesystem between them -- which is the thing a second
;   terminal is FOR, and the first time anything in this suite has had two shells alive at once.
;
;   THE TRANSCRIPT OF CONSUL 2.  Everything /dev/tty1 printed is written to a file by
;   test/ttyhost.c and diffed against multi.expected.  Consul 1's stream is asserted here, by
;   expect; Consul 2's has never had an oracle at all.
;
;   AND SINCE TASK C6, THE USERLAND THAT ASSUMES ALL THAT.  Stages 12 onward are the commands
;   whose subject is the OTHER person: who reads the /etc/utmp table that stages 3-6 filled in,
;   and mesg turns guest's own terminal off and on again -- a chmod(2) uid 7 is allowed only
;   because login chown()ed the node first.  They need no boot of their own and no volume of
;   their own; what they need is two live sessions, which is what this file already is.
;
; HOW CONSUL 2 IS CONNECTED, AND WHY IT IS THE SIMULATOR THAT DIALS OUT.  A Consul line is a
; terminal only while a client is attached -- vt_putc()/vt_puts() in besm6_tty.c return early on
; !t->conn, so an unattached line discards what the guest prints to it, silently.  login.ini
; LISTENS (`attach tty26 Line=26,4199') and that is right for a human with a telnet client, but
; not for a script: the accept happens in tmxr_poll_conn(), which is polled at most once per
; second of HOST time, and measured here it lands about a second after `go' -- AFTER init's
; merge() has forked the getty on /dev/tty1 and after that getty has printed its prompt into the
; void.  Turning it round removes the race rather than papering over it.  test/ttyhost binds the
; port BEFORE the simulator is started, `Connect=' opens the connection when this file is parsed,
; i.e. before `go', and the first poll of the run completes it -- long before the root is mounted.
; See ttyhost.c's header for the rest.
;
; IT NEEDS A SIMULATOR NEW ENOUGH TO TYPE AT A MUX LINE AT ALL.  besm6_tty.c's vt_getc() used to
; test only TMXR_VALID, the tag tmxr_getc_ln() puts on a character that came off the SOCKET; a
; character injected by `send TTY:n,"..."' carries SCPE_KFLAG instead, and was dequeued and then
; dropped -- so `send' on any BESM-6 mux line was a silent no-op, which is why no test had ever
; typed at Consul 2 and why the fix is in the simulator rather than here.  Take the fix out and
; this file stalls at stage 6, with the getty prompt in multi.tty1 and nothing typed back.
;
; AND `Line=26,' IS NOT DECORATION.  `attach tty26 4199' does NOT bind line 26: tty_attach() passes
; the string to tmxr_attach() with the comment "the unit number is ignored for the port
; assignment", so it makes a MUX-WIDE endpoint and tmxr_poll_conn() gives the connection to the
; lowest free line -- line 1, a bit-serial line this guest has no driver for.  The simulator says
; which line it gave it to (`*** tty26: a new connection'), and that is the way to check.
;
; THE ORDER IS THE ASSERTION, AND IT IS CARRIED BY THE CHAIN OF RULES.  Everything below is armed
; before the machine runs a single instruction -- an `expect' command with an action arms a rule
; and returns; the `; step' at the end of each line is part of that ACTION, not a command of its
; own, so what actually starts the machine is the lone `step' at the foot of the file and what
; keeps it going is each rule restarting it.  (sim_set_expect() takes the whole rest of the line
; as the action string; a BARE `send' here would be issued at parse time, before the boot, which
; is exactly the mistake this note exists to prevent.)  So the file cannot say "now do this":
; every stage is reached only by matching the output of the one before, and where the two
; terminals have to be sequenced that match is on the OTHER line --
;
;   stage 5   root's shell prompt, on the console, is what types `guest' at Consul 2.  guest
;             therefore logs in with root already at a prompt, which is what makes the two
;             sessions concurrent rather than merely consecutive.
;   stage 8   guest's prompt after the redirect, at Consul 2, is what types `cat' on the console.
;             root reads the file only once guest's shell says it is written.
;
; Between those two hand-overs exactly one terminal is ever talking, which is deliberate: the
; other one printing while its rule was not yet armed is the failure mode this arrangement has.
;
; EVERY `send' CARRIES `after=20000 delay=20000', both halves, for the reason login.ini's header
; states at length: a send issued straight out of an expect can lose its first character, and a
; getty reading RAW one read(2) per character can lose the second.  There are two RAW gettys in
; this dialogue rather than one.
;
; EVERY expect IS THE TAIL OF THE OUTPUT BEFORE IT, and must be unique in ITS OWN stream -- the
; console and line 26 have separate match buffers, so a rule on one never sees the other's output.
; The last rule carries the echo of `sync', a command that appears nowhere else.  Never end this
; file on a rule a bare prompt satisfies.
;
; THE DISK IS A COPY AND IS WRITABLE, at volume 3085 (3084 is login, the highest before this).
; run-multi.sh converts it fresh for every run, then fscks it and asks for the modes.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev and exece() stages the argument
; list there.  See boot.ini.in, which says it at length.
;
; A FAILURE IS TIMEOUT-SHAPED, deliberately.  Where it stopped is the diagnosis; look the PC up in
; ../unix.nm for the kernel or in build/rootfs/{etc/getty,bin/login}.nm for userland.  If Consul 2
; is the thing in doubt rather than the dialogue, multi.tty1 in the build directory is what it
; actually printed, banners and all -- an empty one means the connection never came up and nothing
; below could have worked.

reset
set cpu latin
set mmu cache
set tty25 raw8
set tty26 raw8

attach tty25 console
attach tty26 Line=26,Connect=127.0.0.1:4200;notelnet
attach md00 root3085.disk
attach -n drum0 multi0.drum
attach -n drum1 multi1.drum
load ../unix

; 1 -- the single-user prompt; the only rule in this file that may match a bare prompt.
expect "# " send after=20000 delay=20000 "\004"; step 50000000

; 2 -- Consul 2's getty, the first thing this port has ever printed to a connected second
;      terminal.  merge() forks it together with the console's, so this fires about when stage 3
;      does; nothing is typed back yet.  An action's commands are PUSHED AHEAD of whatever is
;      already pending rather than replacing it (sim_brk_setact), so two rules matching at once
;      cost nothing -- which is the only reason a rule on the other line is safe here at all.
expect TTY:26,"login: " echof "tty1: a getty is prompting on the second Consul"; step 50000000

; 3 -- the tail of the date /etc/rc prints, then the console getty's prompt.  Unique: nothing else
;      in that stream carries `GMT 2026', and the seconds are left out of the match.
expect "GMT 2026\r\n\r\nlogin: " send after=20000 delay=20000 "root\r"; step 50000000

; 4 -- getty's own RAW echo of the name, then login's getpass prompt.  The password is `root' and
;      is not on the image: /etc/passwd carries the DES hash and login.ini's header says the rest.
expect "root\r\nPassword:" send after=20000 delay=20000 "root\r"; step 50000000

; 5 -- the last line of /etc/motd, printed by showmotd(), then uid 0's prompt -- AND THE HAND-OVER.
;      guest is typed at Consul 2 from here, so that it logs in with root already at a shell.
expect "will teach it.\r\n# " send TTY:26,after=20000 delay=20000 "guest\r"; step 50000000

; 6 -- guest's password field is empty, so there is no prompt at all: straight to the motd and to
;      `$ ', which is uid 7's prompt (cmd/sh/main.c picks it off getuid()).  Two shells now, at two
;      privilege levels, on two typewriters.
expect TTY:26,"will teach it.\r\n$ " send TTY:26,after=20000 delay=20000 "tty\r"; step 50000000

; 7 -- guest names its terminal.  ttyname(3) matches by I-NUMBER, which is why /dev/tty1 answers
;      with its own name rather than /dev/console's -- root.manifest gives the three nodes three
;      inodes for exactly this, and stage 11 is the other arm of it.
expect TTY:26,"/dev/tty1\r\n$ " send TTY:26,after=20000 delay=20000 "echo hello from tty1 >/tmp/two\r"; step 50000000

; 8 -- guest's shell has written a file -- /tmp is mode 0777, which is what lets uid 7 create one
;      there -- AND THE SECOND HAND-OVER: root reads it only now.
expect TTY:26,"/tmp/two\r\n$ " send after=20000 delay=20000 "cat /tmp/two\r"; step 50000000

; 9 -- one filesystem between two typewriters, which is what a second terminal is FOR.
expect "\r\nhello from tty1\r\n# " send after=20000 delay=20000 "ls -l /dev/console /dev/tty1\r"; step 50000000

; 10 -- both owners in one listing, resolved to names through /etc/passwd (cmd/ls).  This is the
;       console's half of what run-multi.sh then asserts off the disk itself.  The mtime is the
;       image's own -T stamp and chown() moves only the ctime, so these two lines are literals.
expect "guest   0,  1 Jul 25 08:23 /dev/tty1\r\n# " send after=20000 delay=20000 "tty\r"; step 50000000

; 11 -- and the console names itself.
expect "/dev/console\r\n# " send after=20000 delay=20000 "who\r"; step 50000000

; ---- TASK C6 FROM HERE.  Everything above proved the two sessions exist; what follows is the
;      userland that assumes them.  Nothing new is attached and nothing is grafted onto the
;      image: these are commands typed at the two shells that are already running.

; 12 -- who, and THE FIRST TIME ANYTHING HAS READ /etc/utmp.  init creates that file and blanks
;       a record in it, login writes one and getlogin() reads the single record it is standing
;       on; nothing had ever printed the table.  Both lines are matched, and so is their ORDER:
;       the file is indexed by ttyslot(), /etc/ttys puts console on line 1 and tty1 on line 2,
;       so root comes first however the two logins were sequenced.  Record 0 is blank and is
;       skipped -- ttyslot() counts from 1, so nothing ever writes it.
;
;       THE STAMP IS THE RUNNING CLOCK, not the image's -T mark: it is what login's time() read.
;       It is hard-coded to the minute for the same reason stage 10's ctime is -- iinit() seeds
;       the clock from the superblock's s_time and /etc/rc prints 08:23:0X, so both logins land
;       inside that minute.  The seconds are not matched.
expect "who\r\nroot     console Jul 25 08:23\r\nguest    tty1    Jul 25 08:23\r\n# " send after=20000 delay=20000 "who am i\r"; step 50000000

; 13 -- `who am i', which is the other question: ttyname(0) cut down to a line name by the same
;       expression login used to store it (`strchr(ttyn + 1, '/') + 1'), then matched against
;       the table.  It answers for the terminal it was typed at and not for whichever is first,
;       which is the arm of stage 7's i-number point that only a second terminal can make.
;       The echo is part of the match because this exact line was already printed by stage 12.
expect "who am i\r\nroot     console Jul 25 08:23\r\n# " send TTY:26,after=20000 delay=20000 "mesg\r"; step 50000000

; 14 -- THE HAND-OVER, and mesg is asked on Consul 2 rather than on the console because that is
;       where it means something: chmod(2) is gated on owner() (kernel/sys4.c), so uid 7 may
;       touch /dev/tty1 only because login chown()ed it before dropping privilege.  The node
;       ships 0622 (root.manifest), so the first answer is `is y'.  mesg writes its report to
;       STANDARD ERROR, which looks like a mistake until you notice it is descriptor 2 that it
;       asked about.
expect TTY:26,"mesg\r\nis y\r\n$ " send TTY:26,after=20000 delay=20000 "mesg n\r"; step 50000000

; 15 -- silence: chmod 0600.  Nothing is printed, so the echo and the prompt are the whole of it.
expect TTY:26,"mesg n\r\n$ " send TTY:26,after=20000 delay=20000 "mesg\r"; step 50000000

; 16 -- and the report has changed, which is the only proof the chmod reached the inode from
;       inside the guest.  THE HAND-OVER, and the reason mesg is turned off before write is
;       tried rather than after: root now attempts to write to a terminal that has said no.
expect TTY:26,"mesg\r\nis n\r\n$ " send after=20000 delay=20000 "write guest\r"; step 50000000

; 17 -- REFUSED, AND ROOT IS REFUSED.  This is the assertion the whole mesg/write pair exists
;       for.  The open() SUCCEEDED -- uid 0 passes every permission gate in this kernel, and
;       root could put the bytes there with cat(1) -- and write then fstat()ed the descriptor
;       it already holds and refused itself on `(st_mode & 02) == 0'.  It is a convention
;       between two programs, not a kernel check, and cmd/wall below is the deliberate other
;       half: it makes no such test.  Nothing reaches Consul 2 in this stage, which is why the
;       next thing multi.expected shows there is the message from stage 19.
expect "write guest\r\nPermission denied\r\n# " send TTY:26,after=20000 delay=20000 "mesg y\r"; step 50000000

; 18 -- 0622 again, and the same command again.  From here the sequencing is entirely on the
;       OTHER line: write prints nothing at all on the console, so there is no local output to
;       key on -- what says it is running is the banner arriving at Consul 2.
expect TTY:26,"mesg y\r\n$ " send after=20000 delay=20000 "write guest\r"; step 50000000

; 19 -- the first time anything on this machine has written to a terminal it does not own.
;       `root' comes out of /etc/utmp -- the record whose ut_line matches this terminal -- and
;       `console' is that line name, so the banner is assembled from the same table who printed.
expect TTY:26,"Message from root console...\r\n" send after=20000 delay=20000 "hello guest\r"; step 50000000

; 20 -- a line of the message itself, copied read(2) to write(2) with the terminal in canonical
;       mode, so it arrives when the CR does and not before.
expect TTY:26,"hello guest\r\n" send after=20000 delay=20000 "\004"; step 50000000

; 21 -- ^D, which write turns into the `EOF' its recipient sees before it exits.  Typing the
;       next command here is safe with no prompt in hand: the characters queue in the clist and
;       the shell reads them when it is ready.
expect TTY:26,"EOF\r\n" send after=20000 delay=20000 "echo attention all users >/tmp/wallmsg\r"; step 50000000

; 22 -- a message for /etc/wall to broadcast.  It is a file rather than a pipe because wall
;       reads its standard input to end-of-file and the point here is the fan-out, not the
;       plumbing.
;
;       THESE TWO STAGES CARRY `step 500000000' AND NOT 50000000, WHICH IS THE ONLY PLACE IN
;       THIS SUITE THAT NEEDS IT.  Every other stage waits on a program that is CPU-bound and
;       finishes in a few hundred thousand instructions; wall is the first thing tested here
;       that waits on the WALL CLOCK, sleeping one second per recipient before it forks (an
;       interval that is v7's, and is there to stagger two terminals a single operator might
;       be watching).  Measured, one second of guest time is most of a 50,000,000-step budget
;       and two seconds is more than one, so the default budget expires in the middle of the
;       broadcast and the failure looks exactly like a hung program -- the diagnosis costs an
;       afternoon if this note is not here.  The budget is a CEILING and not a delay: the
;       stage still ends the instant its expect matches, so the tenfold rise costs nothing on
;       a passing run.
expect "/tmp/wallmsg\r\n# " send after=20000 delay=20000 "/etc/wall /tmp/wallmsg\r"; step 500000000

; 23 -- THE CONSOLE'S COPY, which arrives first: wall walks /etc/utmp in slot order, so the
;       record ttyslot() put on line 1 is served before the one on line 2, and there is a
;       sleep(1) between them.  wall makes no mesg check, which is what its manual page means
;       by the super-user overriding the protections a user has invoked.
expect "Broadcast Message ...\r\n\r\nattention all users\r\n" echof "console: the broadcast arrived on line 1"; step 500000000

; 24 -- AND CONSUL 2's COPY, a second later, from a different child.  This rule is armed a
;       whole second of guest time before the bytes it waits for, which is deliberate: wall
;       does not wait for its children, so the parent's exit and the second child's write
;       happen at the same instant and a rule armed on the console's prompt would be racing
;       them.
expect TTY:26,"Broadcast Message ...\r\n\r\nattention all users\r\n" send after=20000 delay=20000 "stty\r"; step 50000000

; 25 -- stty WITH NO ARGUMENT, on the console, and the answer is scopen()'s own first-open
;       state: ECHO | CRMOD | XTABS, printed as `echo -nl -tabs', over the erase and kill
;       characters ttychars() set.  Every capability v7 could report and this driver does not
;       honour was CUT from the program (cmd/stty/README.md), which is why there is no `speed
;       0 baud' line here and no delay fields: the report is exactly as long as the truth.
;       It goes to the STANDARD ERROR, which is v7's.  The flag ORDER is v7's prmodes()
;       order and not the table's: CRMOD before ECHO.
expect "stty\r\nerase = '#'; kill = '@'\r\n-nl echo -tabs \r\n# " send after=20000 delay=20000 "stty tabs\r"; step 50000000

; 26 -- and a mode really changes.  XTABS is the one delay-mask bit that is live here --
;       ttyoutput() expands a tab by column -- so `tabs' (meaning "the terminal has tabs of
;       its own, do not expand") is the one of these two words that this machine can act on.
expect "stty tabs\r\n# " send after=20000 delay=20000 "stty\r"; step 50000000

; 27 -- -tabs is gone from the report, which is the whole assertion: gtty() read back what
;       stty() wrote, through ttioccomm() and the same struct sgttyb.
expect "stty\r\nerase = '#'; kill = '@'\r\n-nl echo \r\n# " send after=20000 delay=20000 "stty -tabs\r"; step 50000000

; 28 -- put it back, because the console is left to the next thing that boots this image and
;       a terminal that no longer expands tabs is a difference nothing else here expects.
expect "stty -tabs\r\n# " send after=20000 delay=20000 "stty nosuchmode\r"; step 50000000

; 29 -- an unknown word is a diagnostic and NOT a refusal: v7 reports it and then writes the
;       modes anyway, which is worth pinning because it is the arm that says eq() consumed
;       the argument list correctly.
expect "unknown mode: nosuchmode\r\n# " send after=20000 delay=20000 "sync\r"; step 50000000

; 30 -- `sync', LAST.  There is no update daemon here, so without it the delayed-write buffers
;       holding /etc/utmp and the two terminals' new ownership would still be in core when the
;       simulator stops, and the host-side half would see none of it.
expect "sync\r\n# " echof "PASS: multiuser -- a getty on each Consul, root logged in on /dev/console and guest on /dev/tty1 AT THE SAME TIME, each shell naming its own terminal, guest's file read by root's shell, who reading both records out of /etc/utmp, mesg turning guest's own terminal off and on again, a write REFUSED by that and then delivered, /etc/wall reaching both typewriters from two forked children, and stty reading and writing the console's own modes"; quit

; The machine has not run yet: every line above only ARMED a rule.  This is what starts it, and
; if any stage stalls it is also what runs out.
step 50000000

echof "FAIL: the two-terminal dialogue never completed -- the last expect never fired.  See multi.ini for what each stage sends and expects; remember that a stage's expect is the tail of the previous output IN ITS OWN STREAM, and that multi.tty1 holds everything Consul 2 printed.  PC:"
ex PC
exit 1
