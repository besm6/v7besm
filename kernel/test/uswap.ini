; uswap -- a real process image through the real drum, and a shared text with it.
;
; Task 26's mechanical half.  The program links kernel/text.o, kernel/slp.o, kernel/dev/bio.o
; and kernel/dev/mb.o against a hand-built proc[0], coremap and swapmap, and then really
; swaps: two images out to the drum and back in the other order, the u-area through xswap(),
; and a shared text segment written out by its last sharer and read back by the next.
; uswap.c's header says what each leg is for.
;
; TWO DRUMS, `-n', AS EVERY DRUM TEST ATTACHES THEM.  They are swapdev here, they start
; empty, and they are this test's own files so that ctest can run the SIMH tests in
; parallel.  `-n' creates them at zero length, which is what a scratch paging store wants.
;
; `set mmu cache' is set because everything here goes near the write cache, and because a
; test that only worked with it off would not have worked on the real machine.
;
; DO NOT READ A PASS HERE AS A VERDICT ON kernel/dev/mb.c's drainbrz().  That drain is still
; untested, and this test was measured, not assumed: deleting it leaves uswap green.  The
; reason is structural.  БРЗ is eight lines evicted by age, and between the last store that
; fills a swap page and the 033 that hands it to the controller lie far more than eight
; kernel stores -- swap() alone writes b_flags, b_dev, b_wcount, b_blkno and b_paddr, and
; b6cc materializes each destination pointer through a frame slot, so every one of those is
; two stores.  The lines are gone by age before the drain could matter.  kernel/dev/md.c is
; where the hazard DID bite, and the difference is exactly that: its sector header is stored
; two instructions before the exchange.  Keeping the drain is right -- a future caller need
; not leave eight stores behind it -- but no test in the tree bites it, and saying so is
; better than a green run that quietly means nothing (kernel/TODO.md says this at length).
;
; `step N' rather than `go': a lost completion or a wedged sleep HANGS, and only a step
; budget turns a hang into a failure.  The budget is generous because the legs really wait
; on the device -- nine page exchanges plus the sector traffic underneath them.

reset
set cpu latin
set mmu cache

attach -n drum0 uswap0.drum
attach -n drum1 uswap1.drum

load uswap
step 50000000
if (PC != 0640) echof "FAIL: uswap, expected halt in halt() at PC 0640, got:"; ex PC; exit 1
if (ACC != 0) echof "FAIL: uswap (1 stub ran, 2 B_ERROR, 4 xswap did not store, 010 swapin, 020 image did not move, 040 wrong words, 0100 the OTHER image's words, 0200 stale u page, 0400 uhome, 01000 xccdec, 02000 text data, 04000 x_ccount/x_flag, 010000 counters, 020000 grown tail not zero); ACC:"; ex ACC; exit 1

echof "PASS: uswap (two images and a shared text through the real drum, and the u-area with them)"
quit
