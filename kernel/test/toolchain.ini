; THE MACHINE BUILDING AND RUNNING ITS OWN PROGRAM -- task C9's "done when".
;
; inspect.ini is the model: a boot of its own rather than a section of an existing script,
; because what this needs is something no other test here arranges.  For inspect that was a
; PLURALITY of processes; for this it is a TOOLCHAIN AT ABSOLUTE PATHS.  /usr/bin/cc looks
; for /usr/bin/cpp, /usr/bin/as and /usr/bin/ld, appends /usr/include to every preprocessor
; run, and finds /lib/crt0.o, /lib/libc.a and /lib/libruntime.a for the link -- and under
; b6sim every one of those six paths is the BUILD MACHINE's.  The b6sim suite in
; cmd/cc/rootfs/test therefore pins the sub-tools with B6CPP/B6AS/B6LD and links -nostdlib
; with everything named by hand, which is the right way to compare two drivers and is
; exactly what leaves the search unasserted.  Here nothing is pinned and nothing is named.
;
; FIVE THINGS ARE UNREACHABLE UNDER b6sim, and toolchain.sh's header is the long form: cc's
; own path search; /lib and /usr/include, which task C9e put on the image for this and for
; nothing else; three forks and three execs through the real kernel, waited for with the
; argument-less wait(2) this system has instead of waitpid(); the EXECUTION of an a.out the
; machine built during the run, which getxfile() reads and nothing on the host has touched;
; and cc's temporaries in the image's own /tmp, made with mkstemps(3) and removed by the
; atexit(3) handler libc gained in the same task -- the only place either is visible.
;
; It boots the same kernel with a WRITABLE copy of the root image, tells the shell to run
; /etc/toolchain (kernel/test/toolchain.sh), and stops when that script says it is finished.
; The diff happens on the HOST afterwards; see run-toolchain.sh, of which this file is the
; middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in filters.ini and inspect.ini.  What there is is
; the step budget, and it is a real one for this script: cc runs three sub-programs and each
; of them reads and writes files, so this is among the longest-running scripts in the suite.
; A budget rather than `go' means a linker that loops turns into a failure with a PC rather
; than a run that never ends.
;
; THE DISK IS ATTACHED WITHOUT -r, because the script writes hello, hello.o, hello2, prep.c
; and prep.i into /tmp and syncs at the end.  root3102.disk is converted out of root.img by
; run-toolchain.sh, freshly for every run, with the script and the generated hello.s grafted
; in; root3072.disk, the build artifact, is never written by anything.  Not `-n' either:
; that would CREATE AND FORMAT an empty container, on which sbcheck() would fail and the
; boot would panic.
;
; 3102 IS THIS TEST'S OWN VOLUME, and it was the next free one: 3072 is the artifact, mdtest
; owns 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080, swap
; 3081, files 3082, utils 3083, login 3084, multi 3085, edit 3086, fsinfo 3087, dd 3088,
; mkfs 3089-3090, fsck 3091-3092, mount 3093-3096, filters 3097, tar 3098-3099, accounts
; 3100 and inspect 3101.  The volume number is the rightmost run of digits in the filename;
; `attach' scrapes it, so the name IS the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; That matters more here than anywhere else in this directory: this script execs seven
; programs and three of them are execs cc made itself.  See boot.ini.in, which says it at
; length.  They are named for this test because ctest runs the SIMH tests in parallel and
; the others want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
;
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3102.disk
attach -n drum0 toolchain0.drum
attach -n drum1 toolchain1.drum
load ../unix

expect "# " send "sh /etc/toolchain\r"; step 900000000
expect "toolchain done" echof "PASS: toolchain -- the machine assembled, linked and RAN a program with its own tools. cc found /usr/bin/{cpp,as,ld} by its own search, linked against the /lib/{crt0.o,libc.a,libruntime.a} task C9e put on this disk, forked and exec'd three sub-programs through the real kernel, and the a.out that came out executed. size and nm read it back, a relink from the separate .o was byte-identical, every temporary cc made in the image's own /tmp was gone afterwards, cpp resolved a header out of the image's /usr/include -- and cc, handed a .c file, said what it cannot do instead of reporting a missing file"; quit

step 900000000

echof "FAIL: /etc/toolchain never finished -- it either never started or never reached its last line. Anything the script printed before stopping is above, and /tmp/toolchain.log on the pack holds whatever reached it. Look first at whether cc found its sub-tools: an image missing /usr/bin/as, /usr/bin/ld or any of /lib stops at the first command with a diagnostic, and root.manifest plus ROOTFS_FILES in kernel/test/CMakeLists.txt are the two lists that have to name them. See toolchain.sh for what it does, and run-toolchain.sh for what happens to the disk afterwards. PC:"
ex PC
exit 1
