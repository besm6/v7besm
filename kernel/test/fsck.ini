; fsck(1M) REPAIRING A FILESYSTEM OVER THE RAW DEVICE -- task C4d's "done when".
;
; The ladder this sits at the top of: fsinfo (3087) reads /dev/rmd0, dd (3088) moves bulk
; data through it, mkfs (3089/3090) writes a filesystem onto a second pack.  This one is
; the first to write a filesystem it did NOT make -- to take a volume that is wrong,
; understand what is wrong with it, and put it right.  cmd/fsck/README.md is the account,
; fsck.sh is the middle and run-fsck.sh the host half.
;
; ALMOST NOTHING IS ASSERTED HERE, as in mkfs.ini, dd.ini and fsinfo.ini.  The thirteen
; cmd_fsck_* cases next door already damage an image thirteen ways, repair each under
; b6sim in about a tenth of a second, and require `b6fsutil -c' -- a separate
; implementation of the same checks -- to pronounce each result sound.  So the algorithm is
; settled before this file runs.  What is left, and what this boots for, is the DEVICE.
;
; TWO DRIVES, AND NEITHER IS ATTACHED WITH -n.
;
;   attach md00 root3091.disk      the system, converted out of root.img by run-fsck.sh for
;                                  every run with fsck.sh grafted in.  No -r, because the
;                                  script writes.
;   attach md01 scratch3092.disk   the pack to be repaired.  This is where this test parts
;                                  company with mkfs.ini, which uses `attach -n' because
;                                  SIMH has to format a blank pack for mkfs to write on.
;                                  Here the pack must arrive already carrying a filesystem
;                                  -- a DAMAGED one, which the host built with `b6fsutil -n
;                                  -M' and then broke with `b6fsutil -D' -- so the container
;                                  comes from the host and `-n' would erase exactly the
;                                  thing under test.
;
; md01 IS DRIVER MINOR 1: kernel/dev/md.c encodes the minor as bit 5 controller, bits 4-3
; group, bits 2-0 drive, which is SIMH's own numbering, so /dev/rmd1 and `md01' are the
; same number written twice.  mkfs.ini says the same at more length.
;
; 3091 is this test's root copy and 3092 its scratch -- 3072 is the artifact, mdtest owns
; 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081,
; files 3082, utils 3083, login 3084, multi 3085, edit 3086, fsinfo 3087, dd 3088 and mkfs
; 3089 with 3090.  The volume number is the rightmost run of digits in the filename;
; `attach' scrapes it, so the name IS the volume.  run-fsck.sh checks that the scratch pack
; still calls itself 3092 when it comes back, which it does only because nothing fsck writes
; is block 0 -- fmin is at least 2, so it cannot be.  cmd/mkfs/README.md is the rule.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image.  Named for this test because ctest
; runs the SIMH tests in parallel.
;
; `set mmu cache' is load-bearing rather than decoration, for mkfs.ini's reason: a WRITE
; exchange reads memory rather than the write cache, so kernel/dev/md.c's drainbrz() is on
; the path everything below takes.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3091.disk
attach md01 scratch3092.disk
attach -n drum0 fsck0.drum
attach -n drum1 fsck1.drum
load ../unix

expect "# " send "sh /etc/fscktest\r"; step 600000000

expect "fsck done" echof "PASS: fsck -- the shell ran /etc/fscktest, which repaired a deliberately damaged filesystem on /dev/rmd1 over the real write path (an orphaned file reconnected into /lost+found, and the whole free list of a 2000-block volume laid down again in phase 6), found nothing left to do on a second pass, and then checked the mounted root read-only and agreed with df about how much of it is free; the host now has that pack to convert and check"; quit

step 600000000

echof "FAIL: fsck did not get to the end. If nothing above says `fsck done', /etc/fscktest either never started or never reached its last line, and the section it stopped in says where to look. In ---repair---: the repair is a scatter of small WRITES, so suspect mdwrite() and mdstrategy() before the arithmetic -- an EFAULT means one of the conditions in cmd/df/README.md is broken; and phase 6 rebuilds the free list of the whole pack, which is about six chain-block writes spread across 2000 blocks. In ---again---: the repair did not take, so what phase 6 wrote is not what freechk() can read back -- compare with cmd_fsck_freecnt, which asserts the same salvage under b6sim where the device cannot be at fault. In ---root---: this is the MOUNTED root being read while the machine runs on it, so a hang here is the raw path and the buffer cache disagreeing, not fsck. Anything else went to /tmp/fsck.log, which run-fsck.sh would have extracted had the run got that far. PC:"
ex PC
exit 1
