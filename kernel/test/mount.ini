; mount(1M) PUTTING A SECOND FILESYSTEM ON THE MACHINE -- task C4f's "done when", and the
; last of task C4.
;
; The ladder this sits at the top of: fsinfo (3087) reads /dev/rmd0, dd (3088) moves bulk
; data through it, mkfs (3089/3090) writes a filesystem onto a second pack, fsck (3091/3092)
; repairs one it did not make.  Every rung of that is the RAW device -- physio() ->
; mdstrategy() -> mdwrite().  This one is the first to reach a second drive through the
; BUFFER CACHE instead: bdevsw[0] minor 1 had never carried a block, smount() had never had
; a caller, and mount[1] had never been filled.  cmd/mount/README.md is the account,
; mount.sh is the middle and run-mount.sh the host half.
;
; IT ALSO CLOSES TASK C4e's ONE LOOSE END, which ../../cmd/TODO.md said was worth folding in
; here rather than doing on its own: icheck, dcheck, ncheck and clri were asserted under
; b6sim alone, where read(2) and write(2) are the host's.  Section 7 of mount.sh runs all
; four over the real device -- on a pack that has just been mounted and written, which is a
; filesystem no host tool laid out.
;
; ALMOST NOTHING IS ASSERTED HERE, as in fsck.ini, mkfs.ini, dd.ini and fsinfo.ini.  The
; difference from those is that next door there is almost nothing either: cmd/mount/test has
; four cases and all four stop BEFORE mount(2), because b6sim services a system call on the
; host and mounting something on the build machine is not a test.  So this file is not the
; second word on these two programs, the way fsck.ini is the second word on cmd_fsck_*.  It
; is the only word.
;
; FOUR DRIVES, WHICH NOTHING HERE HAS EVER ATTACHED.  mkfs and fsck have two; the third is
; blank on purpose and the fourth is a second copy of the fixture, for section 6.
;
;   attach md00 root3093.disk      the system, converted out of root.img by run-mount.sh for
;                                  every run with mount.sh grafted in.  No -r: the script
;                                  writes, and /etc/mtab is one of the things it writes.
;   attach md01 scratch3094.disk   the pack to be mounted.  It must arrive already carrying
;                                  a filesystem -- the host builds it with `b6fsutil -n -M
;                                  mount.manifest' -- so `-n', which formats a blank pack,
;                                  would erase the thing under test.  This is fsck.ini's
;                                  arrangement rather than mkfs.ini's, which needs `-n' for
;                                  the opposite reason.
;   attach -n md02 blank3095.disk  A PACK WITH NOTHING ON IT, and `-n' is the whole point:
;                                  SIMH formats every zone and leaves the data zeros, which
;                                  is a readable device with no filesystem on it.  mount.sh
;                                  mounts it expecting sbcheck() to refuse, which is what
;                                  retires cmd/mount/mount.1m's oldest BUGS line.  Nothing
;                                  writes it and nothing checks it afterwards; it has no
;                                  raw node on the image either.
;   attach md03 scratch3096.disk   THE SECOND FILESYSTEM, and it is here because NMOUNT is 8
;                                  rather than 2: mount[0] is the root's, so a table of two
;                                  left one slot and no test in this port has ever had two
;                                  filesystems mounted at once.  Section 6 of mount.sh mounts
;                                  this one on /usr while md01 is on /mnt, which fills
;                                  mount[2].  Built from the SAME mount.manifest as md01's
;                                  pack, so the two carry the same names on different devices
;                                  -- and like md01 it must arrive with a filesystem already
;                                  on it, so no `-n'.  It is mounted, read and unmounted and
;                                  never written; run-mount.sh checks it comes back sound
;                                  anyway, since a mount writes the superblock on the way out.
;
; md01 IS DRIVER MINOR 1: kernel/dev/md.c encodes the minor as bit 5 controller, bits 4-3
; group, bits 2-0 drive, which is SIMH's own numbering, so /dev/md1, /dev/rmd1 and `md01'
; are the same number written three times.  mkfs.ini says the same at more length.
;
; 3093 is this test's root copy, 3094 its scratch, 3095 the blank and 3096 the second scratch -- 3072 is the artifact, mdtest owns
; 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081,
; files 3082, utils 3083, login 3084, multi 3085, edit 3086, fsinfo 3087, dd 3088, mkfs 3089
; with 3090 and fsck 3091 with 3092.  The volume number is the rightmost run of digits in
; the filename; `attach' scrapes it, so the name IS the volume.  run-mount.sh checks that the
; scratch pack still calls itself 3094 when it comes back, and here that check means
; something it has not meant before: the writes it survives are the CACHE's rather than
; physio()'s.  SUPERB is block 1, alloc() is bounded by badblock(), and block 0 is therefore
; unreachable from a mounted filesystem -- which is what keeps the volume number, the sector
; header service words being per controller.  cmd/mkfs/README.md is the rule.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image.  Named for this test because ctest
; runs the SIMH tests in parallel.  This is also the one test that tries to MOUNT one of
; them, on purpose and expecting EIO: /dev/swap is a block device whose superblock cannot be
; read at all, which is smount()'s other failure arm and the one md02 above does not cover.
;
; `set mmu cache' is load-bearing rather than decoration, for mkfs.ini's reason: a WRITE
; exchange reads memory rather than the write cache, so kernel/dev/md.c's drainbrz() is on
; the path everything below takes.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3093.disk
attach md01 scratch3094.disk
attach -n md02 blank3095.disk
attach md03 scratch3096.disk
attach -n drum0 mount0.drum
attach -n drum1 mount1.drum
load ../unix

expect "# " send "sh /etc/mounttest\r"; step 600000000

expect "mount done" echof "PASS: mount -- the shell ran /etc/mounttest, which mounted a filesystem on /dev/md1 over the buffer cache (the first block bdevsw[0] minor 1 has ever carried), wrote files into it, was refused an unmount while the shell stood in it, remounted it read-only and was refused a write, unmounted it, then mounted TWO filesystems at once -- md1 and md3, which fills mount[2] and is what NMOUNT going from 2 to 8 bought -- and finally took icheck, dcheck, ncheck and clri over the first pack raw, clearing an i-node, seeing two programs fault it, and having fsck put it back; the host now has both packs to convert and check"; quit

step 600000000

echof "FAIL: mount did not get to the end. If nothing above says `mount done', /etc/mounttest either never started or never reached its last line, and the section it stopped in says where to look. In ---bad---: these are argument refusals and the only one that touches the disk is the /dev/swap mount, which reads block 1 of the drum and must come back EINVAL from sbcheck(). In ---mount--- or ---write---: this is smount() and the buffer cache on a device that has never had either, so suspect getblk()/bwrite() reaching mdstrategy() with a b_dev of minor 1 -- kernel/test/mdtest exercises minors 0, 010 and 040 and has never touched 1. A hang with the pack mounted is the cache and the driver disagreeing; NBUF is 16 and every mount holds one of them permanently for its superblock. In ---busy---: sumount() scans the whole in-core inode table, so a hang here is iget() and not the device. In ---both---: two filesystems are mounted at once, which nothing could do before NMOUNT went from 2 to 8, so this is mount[2] and the code that has only ever seen mount[1] -- smount()'s free-slot scan, namei()'s scan for the m_inodp a `..' climbs out of, and mtab.c's second record. In ---icheck---: the pack is unmounted by now and everything is raw again, so this is task C4e's own path -- compare with cmd_icheck_* and cmd_clri_*, which assert the same arithmetic under b6sim where the device cannot be at fault. Anything else went to /tmp/mount.log, which run-mount.sh would have extracted had the run got that far. PC:"
ex PC
exit 1
