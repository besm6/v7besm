; A SESSION THAT WRITES -- task 25b's "done when".
;
; boot.ini reaches the shell's prompt and console.ini types at it -- and although console.ini
; now makes a directory and removes it again, nothing there looks at the disk afterwards.
; This one does: it boots the same kernel with a WRITABLE copy of the root image, tells the
; shell to run /etc/session (kernel/test/session.sh), and stops when that script says it is
; finished.  Everything that matters then happens on the HOST -- run-session.sh converts the
; container back to a flat image, fscks it, extracts it, and diffs what the session wrote.
; See run-session.sh; this file is only the middle of it.
;
; SO THERE IS ALMOST NO ASSERTION HERE, and that is deliberate.  `session done' says the
; script ran to its end, nothing more.  What the session actually accomplished is a question
; about the disk, not about the console, and it is asked where it can be answered properly:
; a byte-for-byte diff and a five-pass fsck beat any number of expect rules.
;
; THE DISK IS ATTACHED WITHOUT -r, which is the point of the test and is why it is a COPY.
; root3077.disk is converted out of root.img by run-session.sh, freshly for every run, with
; the session script grafted in; root3072.disk, the build artifact, is never written by
; anything.  Not `-n' either: that would CREATE AND FORMAT an empty container, on which
; sbcheck() would fail and the boot would panic.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the other two want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
; `step', not `go': a hang must fail the run instead of hanging it.
;
; WHY THE SHELL IS TOLD TO READ THE SCRIPT rather than the script being executed: there is
; no `#!' on this system -- the shebang is a 4.xBSD invention, and neither getxfile() nor
; b6sim implements it -- so `sh /etc/session' is how a script runs, exactly as runcom() in
; cmd/init/init.c execs `sh /etc/rc'.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3077.disk
attach -n drum0 session0.drum
attach -n drum1 session1.drum
load ../unix

expect "# " send after=20000 delay=20000 "sh /etc/session\r"; step 50000000
expect "session done" echof "PASS: session -- the shell ran /etc/session, which created and wrote files and called sync(2)"; quit

step 50000000

echof "FAIL: the session never finished -- /etc/session either never started or never reached its last line. A PC in the kernel with the step count run out means it hung; anything the script printed before stopping is above. See session.sh for what it does, and run-session.sh for what happens to the disk afterwards. PC:"
ex PC
exit 1
