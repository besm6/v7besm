; umem -- copyinb()/copyoutb() (kernel/ucopy.c) over every phase pair there is.
;
; The program is umem.c; this file only loads it, runs it and reads its verdict out of the
; accumulator.  There are no РП/РЗ assertions here: mmutest owns those, and a second copy of
; them would only mean two files to edit when the forge changes.
;
; `set mmu cache' IS NOT DECORATION.  It turns on true write-back modelling of БРЗ, and the
; drains in umem.c's page-crossing leg are load-bearing under it: that leg writes through the
; MAP and reads back at the PHYSICAL address, so the dirty line carries the wrong tag until
; drainbrz() writes it out.  Without the cache the leg passes either way and says nothing.
;
; `step', not `go': a copy that hangs must fail the run instead of hanging it.  The count is
; generous because the program runs 1,008 short cases and 72 long ones, each seeding and
; checking a whole window.
;
; THE HALT PC is crt0.s's `stop', and the check on it only tells a clean exit from a fault
; halt (`fault: stop 07777', crt0.s).  Every real assertion is in ACC.
;
; ACC, when it is not zero, is packed octal:
;
;      0100000 + (ku << 12) + (kk << 9) + (n << 3) + which     the 6 x 6 x 14 matrix
;      0200000 + (ku << 12) + (kk << 9) +            which     the n = 200 runs
;      1 .. 9                                                  the forge and the special legs
;
; ku is the user-side byte index (0 = byte #0, the word's first) and kk the kernel-side one;
; `which' is
;      1  copyoutb returned nonzero
;      2  the user window does not match the oracle after copyoutb
;      3  copyinb returned nonzero
;      4  the kernel buffer does not match the oracle after copyinb
;
; and the flat codes are
;      1,2,3  the forged map is not what the legs assume
;      4      virtual pages 1 and 2 turned out to be PHYSICALLY adjacent, so the page-crossing
;             leg would prove nothing -- the map changed and the leg must be moved
;      5      the page-crossing copy itself
;      6      ... its physical readback: the copy landed, but not through the map
;      7      a range wholly inside the unmapped hole was not refused
;      8      a range that starts mapped and ends in the hole was not refused
;      9      ... it was refused, but the mapped part had already been written: the useracc
;             word span is flooring where it must ceil
;
; THIS TEST WAS CHECKED BOTH WAYS before iomove() was allowed to call the routines it covers.
; Each line below is one mutation of kernel/ucopy.c, applied alone, and the ACC it produced:
;
;   lead = ptrbyte(p), the `+ 1' dropped .................. 0100132  (ku 0, kk 0, n 11)
;   the phase test dropped -- always peel and bulk ........ 0101062  (ku 0, kk 1, n 6)
;   the trailing partial word never copied ............... 0100012  (ku 0, kk 0, n 1)
;   the useracc span floors instead of ceiling ............ 011      (leg 9)
;   no up-front useracc at all ........................... 011      (leg 9)
;   copyin/copyout called on the raw pointers (task 25c) .. 0100012  (ku 0, kk 0, n 1)
;
; The last two rows of the matrix half are the point: the two `useracc' mutations pass all
; 1,080 matrix cases and fail ONLY leg 9, which is the leg that exists for them.
;
; AND ONE LINE IS PROVABLY NOT COVERED, which is worth saying rather than leaving to be
; assumed: removing `if (lead == NBPW) lead = 0;' leaves this test GREEN.  That line is a pure
; optimisation -- without it the first whole word is peeled one byte at a time and the result
; is still right -- so what defends it is the niobulk/nioedge counters, not this file.

reset
set cpu latin
set mmu cache

load umem
step 100000000
if (PC != 00563) echof "FAIL: umem, expected halt at PC 00563, got:"; ex PC; exit 1
if (ACC != 0) echof "FAIL: umem, a check failed; main() returned (see the packing above):"; ex ACC; exit 1

echof "PASS: umem (copyinb/copyoutb move the right bytes at every phase, and only those)"
quit
