; Consul driver regression test -- the BESM-6 half of kernel/dev/sc.c, in C.
;
; sctest (source sctest.c + crt0.s) drives the operator's typewriter both ways and
; then drives BOTH typewriters at once:
;   - polled, spinning on the ready bit in READY2 (`ext 04102') before each
;     `ext 0174' -- the path kernel putchar()/printf()/panic() take;
;   - interrupt-driven, taking a ГРП interrupt at 0501 on every "printing
;     finished" ПРП bit and feeding the next character from the handler -- the
;     path the tty layer takes;
;   - both Consuls concurrently off one handler, which is the shape dev/sc.c's
;     scintr() has now that cdevsw[0] carries two lines.
; It prints "polled", then "interrupt", then "acegik", and returns 0 iff every
; count came out right.  crt0.s leaves that status in the accumulator and halts.
;
; The console (tty line 25 = Consul 1) is put in RAW8 mode -- each code goes out as
; a raw byte, no character-set translation -- and bound to the SIMH console, so the
; ASCII shows up on stdout unchanged.
;
; CONSUL 2 (tty line 26) IS DELIBERATELY LEFT UNATTACHED, and that is an assertion
; rather than an omission.  SIMH lowers READY2 and raises the "printing finished"
; bit for a Consul whether or not its line is connected -- only the character is
; discarded, by vt_putc()'s connection check -- so every interrupt part 3 counts
; really fires.  What being unattached buys is the other half: Consul 2's six
; characters CANNOT reach stdout, so the `expect' below sees "acegik" and not the
; interleaved "abcdefghijkl" that a byte crossing between the lines would produce.
; A single-line test cannot tell those apart, which is why part 3 exists.
;
; The `expect' HALTS the simulator and then runs its action, and this one is the
; last rule, so it jumps to the checks rather than stepping -- falling through is
; also what a run that merely exhausted its step budget does, and the FAIL block
; below is what tells the two apart.
;
; `step', NOT `go', and that is load-bearing here rather than habit: a ПРП bit
; dismissed for the wrong line leaves GRP_SLAVE re-raising before every instruction,
; and the machine then never reaches its halt at all.  Under `go' that is a hang the
; ctest timeout eventually kills; under `step' it is a failure with a message.
;
; MUTATIONS THAT MAKE PART 3 BITE, all five measured on this file:
;   - SC_PRINT(u) losing its `+ u', so both lines share one `ext' address:
;     status 2, Consul 1's ready bit down when it should be up;
;   - ndone2[u]++ written as ndone2[0]++, one counter for two lines: status 3;
;   - scready[1] written as CONS1_READY >> 1, i.e. assuming the ready bits follow
;     the same shift as the ПРП bits: status 2.  This one is why the ready check
;     asserts a TRANSITION -- as a level test it passed the mutation, bit 7 of
;     READY2 reading zero and satisfying a "must be clear" by accident;
;   - the dismiss written as ~SC_DONE(0), so line 1's bit is never cleared:
;     GRP_SLAVE storms and the step budget runs out;
;   - the test written as `prp & PRP_CONS1_DONE' for both units: status 3.
;
; `reset' first, as in hello.ini: it re-arms the terminal clock that raises the
; console-ready bit and the "printing finished" interrupt this program waits on.

reset
set cpu latin
set tty25 raw8
attach tty25 console

load sctest

expect "acegik" goto checks
step 50000000

echof "FAIL: sctest -- the console never showed Consul 1's part-3 message.  If the stream above reads `abcdefghijkl' rather than `acegik', a character went out on the wrong Consul: the two lines are sharing an `ext' address.  If it shows nothing past `interrupt', the run was still going when the step budget ran out -- a ПРП bit dismissed for the wrong line leaves GRP_SLAVE re-raising forever and the machine never reaches the halt.  PC:"
ex PC
exit 1

:checks
step 50000000
; 0523 is `halt' in sctest.nm -- crt0.s's stop, reached only by a normal return from
; main().  It sits just past the const section, so ADDING A STRING OR A TABLE TO
; sctest.c MOVES IT and this number has to be re-read out of the .nm.  Keeping the
; check is still worth that: without it a trap into `fault' would leave the accumulator
; holding whatever the trap did and could pass.
if (PC != 0523) echof "FAIL: sctest, expected halt at PC 0523 (`halt' in sctest.nm -- re-read it if the const section changed), got:"; ex PC; exit 1
if (ACC != 0) echof "FAIL: sctest -- status 1 is the single-Consul interrupt count, 2 the two ready bits not moving independently (CONS2_READY is bit 6, not bit 7), 3 and 4 Consul 1's and Consul 2's interrupt counts in part 3.  Status:"; ex ACC; exit 1

echof "PASS: sctest (polled + interrupt-driven Consul 1, and both Consuls at once without stealing each other's bits)"
quit
