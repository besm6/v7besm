; tar(1) ON A RUNNING SYSTEM -- task C7's "done when", and the only place in this tree where
; a TREE is archived at all.
;
; The eleven cmd_tar_* cases under cmd/tar/test run the same bytes under b6sim in under a
; second and settle the header layout, the record arithmetic, the blocking factor and both
; directions of interchange with the host's tar.  What they cannot reach is what this boots
; for, and tar.sh's header lists it: the directory walk (b6sim refuses to read a directory
; descriptor), checkdir()'s exec of the setuid /bin/mkdir, the owner/mode/mtime a `tar x'
; puts back, and /dev/rmd1 with physio()'s four alignment conditions on it.
;
; TWO DRIVES, and mkfs.ini's arrangement exactly:
;
;   attach md00 root3099.disk       the system, converted out of root.img by run-tar.sh for
;                                   every run with tar.sh grafted in.  No -r, because the
;                                   script writes; no -n, which would CREATE AND FORMAT an
;                                   empty container on which sbcheck() would fail.
;   attach -n md01 scratch3100.disk the scratch pack.  Here -n IS right: it creates the
;                                   container and formats all 1000 zones, which is the state
;                                   a pack off the shelf is in -- and, unlike mkfs, nothing
;                                   here ever makes a FILESYSTEM on it.  tar writes the
;                                   archive onto the bare device, so what run-tar.sh gets
;                                   back is a tar file with the drive's zeros behind it, and
;                                   the host's own tar reads it straight off.
;
; md01 IS DRIVER MINOR 1: kernel/dev/md.c encodes the minor as bit 5 controller, bits 4-3
; group, bits 2-0 drive, which is SIMH's own numbering, so /dev/rmd1 and `md01' are the same
; number written twice.  mkfs.ini and mdtest.ini say the same thing.
;
; 3099 is this test's root copy and 3100 its scratch.  3072 is the build artifact, mdtest owns
; 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081,
; files 3082, utils 3083, login 3084, multi 3085, edit 3086, fsinfo 3087, dd 3088, mkfs
; 3089-3090, fsck 3091-3092, mount 3093-3096, filters 3097 and accounts 3098.  The volume
; number is the rightmost run of digits in the filename and `attach' scrapes it, so the name
; IS the volume; 3101 is the next free one.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; boot.ini.in says it at length.  This script execs more than most: every mkdir, cmp, find,
; sort and tar is a fork and an exec, and section 7 alone makes thirteen directories.
;
; `set mmu cache' is not decoration.  A WRITE exchange reads memory rather than the write
; cache, so kernel/dev/md.c's drainbrz() is on the path section 9 takes; without the cache
; modelled the raw write would not be exercising it.  `set tty25 raw8' for console.ini's
; reason.  `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3099.disk
attach -n md01 scratch3100.disk
attach -n drum0 tar0.drum
attach -n drum1 tar1.drum
load ../unix

expect "# " send "sh /etc/tartest\r"; step 900000000

expect "tar done" echof "PASS: tar -- the shell ran /etc/tartest, which archived a three-level tree with a hard link and a Cyrillic name, extracted it through the setuid /bin/mkdir and cmp'd every file back, showed with find -newer that the modification times were restored and with the m key that they were not, refused a tree deeper than the walk allows, round-tripped two a.out files, and then wrote the whole archive onto the bare /dev/rmd1 at a physio()-legal blocking factor and read it back -- with a factor of five and two appends refused; the host now has that pack to read with its own tar"; quit

step 900000000

echof "FAIL: tar did not get to the end. If nothing above says `tar done', /etc/tartest either never started or never reached its last line, and the section it stopped in says where to look. In ---create---: this is the first directory walk in this tree, so suspect putfile()'s recursion -- its frame is 239 words measured and the stack is 4,096, and MAXDEPTH is meant to stop it long before that. In ---extract---: checkdir() forks /bin/mkdir, which is setuid root because there is no mkdir(2); a hang here is a wait() for a child that never exec'd. In ---raw---: physio() takes a whole number of BSIZE and mdstrategy() a buffer on a 512-word boundary, so suspect the alignment of tbuf and the blocking factor before the arithmetic -- an EFAULT surfaces as `tape write error' and an EIO means the driver refused the block. cmd/df/README.md has the four conditions. PC:"
ex PC
exit 1
