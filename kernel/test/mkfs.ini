; mkfs(1M) ON A SCRATCH DRIVE -- task C4c's "done when", and the first test here that
; attaches TWO disks, the first that writes a raw device at all, and the first whose subject
; is a filesystem that did not exist when the machine booted.
;
; fsinfo (3087) reads /dev/rmd0 and dd (3088) copies blocks off it, but nothing in this
; directory had ever pushed a block the other way: kernel/dev/md.c's mdwrite() was dead code
; and `dd of=/dev/rmd0' was written, documented and never once run, there being no second
; drive to aim it at and no way to aim it at the root without destroying the run.  This test
; is that harness.  cmd/mkfs/README.md is the account, mkfs.sh is the middle and run-mkfs.sh
; the host half.
;
; ALMOST NOTHING IS ASSERTED HERE, as in session.ini, files.ini, utils.ini, edit.ini, dd.ini
; and fsinfo.ini.  cmd_mkfs_layout next door already compares what mkfs writes with what
; `b6fsutil -n' writes, byte for byte, under b6sim in a tenth of a second -- so the layout is
; settled before this file runs.  What is left, and what this boots for, is the DEVICE: the
; four alignment conditions on a write rather than a read, a second minor number, and a
; second pack under the same controller.
;
; TWO DRIVES, AND THE SECOND IS ATTACHED WITH -n.
;
;   attach md00 root3089.disk       the system, converted out of root.img by run-mkfs.sh
;                                   for every run with mkfs.sh grafted in.  No -r, because
;                                   the script writes; no -n, which would CREATE AND FORMAT
;                                   an empty container on which sbcheck() would fail and the
;                                   boot would panic.
;   attach -n md01 scratch3090.disk the scratch pack.  Here -n IS right: it creates the
;                                   container and formats all 1000 zones -- magic marks and
;                                   self-addresses throughout -- which is exactly the state a
;                                   pack straight off the shelf is in, and the state
;                                   b6fsutil's from_simh() needs to convert it back.
;
; md01 IS DRIVER MINOR 1, and that identity is deliberate: kernel/dev/md.c encodes the minor
; as bit 5 controller, bits 4-3 group, bits 2-0 drive, which is SIMH's own `ctlr*32 +
; group*8 + drive'.  So /dev/rmd1 and `md01' are the same number written twice.  mdtest.ini
; is the only other file here that attaches more than one unit, and it says the same thing.
;
; 3089 is this test's root copy and 3090 its scratch -- 3072 is the artifact, mdtest owns
; 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081,
; files 3082, utils 3083, login 3084, multi 3085, edit 3086, fsinfo 3087 and dd 3088.  The
; volume number is the rightmost run of digits in the filename; `attach' scrapes it, so the
; name IS the volume.  That matters more here than anywhere else: run-mkfs.sh checks that
; the scratch pack still calls itself 3090 when it comes back, which now asserts that md.c
; stamps each DRIVE's own label rather than the controller buffer's.  cmd/mkfs/README.md SS2.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the others want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
; `set mmu cache' is not decoration on this one: a WRITE exchange reads memory rather than
; the write cache, so kernel/dev/md.c's drainbrz() is on the path everything below takes,
; and without the cache modelled the test would not be exercising it.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3089.disk
attach -n md01 scratch3090.disk
attach -n drum0 mkfs0.drum
attach -n drum1 mkfs1.drum
load ../unix

expect "# " send "sh /etc/mkfstest\r"; step 600000000

expect "mkfs done" echof "PASS: mkfs -- the shell ran /etc/mkfstest, which put one block of /etc/motd onto /dev/rmd1 through mdwrite() and read it straight back, had two misaligned writes refused -- the first refused write this system has ever asserted -- got a diagnostic and a non-zero status out of mkfs for a size below the floor and for a size past the end of the drive, then made a 2000-block filesystem on the scratch pack and asked df how much of it was free; the host now has that pack to convert, fsck and compare against b6fsutil -n"; quit

step 600000000

echof "FAIL: mkfs did not get to the end. If nothing above says `mkfs done', /etc/mkfstest either never started or never reached its last line, and the section it stopped in says where to look. In ---dd---: this is the FIRST RAW WRITE this system has ever done, so suspect mdwrite() and mdstrategy() before the arithmetic -- an EFAULT means one of the four conditions in cmd/df/README.md is broken and an EIO means the driver refused the block. In ---bad---: the probe in mkfs's main() reads the last block before writing the first, so a size past the end of the drive fails as a READ of block 2000 and not as a size check. In ---mkfs---: everything after the summary line is the free-list build, which is 1966 iterations and about six exchanges. Anything else went to /tmp/mkfs.log, which run-mkfs.sh would have extracted had the run got that far. PC:"
ex PC
exit 1
