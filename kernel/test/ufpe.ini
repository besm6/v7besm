; From-USER-mode ARITHMETIC-fault test -- the two ГРП causes kernel/trap.c grew for task C18.
;
; ufpe (source ufpe.c + crt0f.S) forges a genuine user-mode context with sureg() and then
; overflows a floating multiply, divides by zero, and finally reads a closed page.  Unlike
; every other forge test it links THE REAL kernel/trap.c, stubbing only what that file calls,
; so what is asserted is the decode itself: SIGFPE, SIGFPE, SIGSEGV, and never panic("trap").
;
; The second property is the one these causes have and the protection faults do not.  The
; machine vectors with the PC already past the faulting instruction and does NOT set
; SPSW_NEXT_RK, so trap()'s restart fix-up is a no-op and the resume lands AFTER the fault.
; Each fault is followed by a store that only runs if it did; a missing mark means the handler
; would have re-faulted forever instead.
;
; `set mmu cache' is required: sureg() reprograms РП and uprog's marks are MAPPED stores read
; back physically, so the БРЗ write-back hazard is live -- as in utrap.
;
; ACC == 0 means every leg held.  A nonzero ACC names the failing check: 1 fault 1 was not
; SIGFPE, 2 fault 2 was not SIGFPE, 4 fault 3 was not SIGSEGV, 010 fault 1 resumed on the
; multiply rather than past it, 020 fault 2 resumed on the divide, 040 too many faults,
; 0100 trap() reached its panic (the cause was not decoded at all), 0200 grow() was asked for
; the wrong page.

reset
set cpu latin
set mmu cache

load ufpe
go
if (PC != 02071) echof "FAIL: ufpe, expected halt in halt() at PC 02071, got:"; ex PC; exit 1
if (ACC != 0) echof "FAIL: ufpe, a check failed (1/2 not SIGFPE, 4 not SIGSEGV, 010/020 resume, 040 count, 0100 panic, 0200 grow); ACC:"; ex ACC; exit 1

echof "PASS: ufpe (a floating overflow and a divide by zero become SIGFPE, and the resume is past the fault)"
quit
