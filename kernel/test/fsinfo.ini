; THE GUEST MEASURING ITS OWN FILESYSTEM -- task C4a's "done when", and the first thing
; this machine can say about its own store.
;
; Every test before this one asks what the guest can DO to the filesystem and then asks the
; HOST whether the result is still one: session creates files, files rearranges and
; re-permissions them, edit authors text into them, and all three end in a b6fsutil fsck.
; This one runs /etc/fsinfo (kernel/test/fsinfo.sh), which asks how much room is left
; (df), what a directory costs (du) and who owns the disk (quot) -- and then the host
; checks each answer against one it works out for itself.  See run-fsinfo.sh, of which this
; file is the middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in session.ini, files.ini, utils.ini and
; edit.ini.  The cmd_df_* and cmd_quot_* cases next door cover the arithmetic under b6sim
; against a fixture filesystem, in a tenth of a second each; what needs a kernel is the
; RAW DEVICE PATH -- physio() and mdstrategy() and the four alignment rules cmd/df/README.md
; sets out, none of which exists under b6sim, whose read(2) is the host's -- plus a
; directory tree du can walk, which b6sim cannot give it at all.
;
; THE CONSOLE TRANSCRIPT IS PART OF THE ORACLE HERE, which is new.  df's and quot's numbers
; are about the whole image and would have to be re-typed into an expectation file every
; time a program joined /bin, so they are not in one: the guest prints them to the console
; between markers, run-fsinfo.sh captures this run's output and diffs them against figures
; it recomputes with b6fsutil.  fsinfo.sh's header says why they cannot go to a file.
;
; THE DISK IS ATTACHED WITHOUT -r, because the script writes a tree for du to walk.
; root3087.disk is converted out of root.img by run-fsinfo.sh, freshly for every run, with
; fsinfo.sh grafted in; root3072.disk, the build artifact, is never written by anything.
; Not `-n' either: that would CREATE AND FORMAT an empty container, on which sbcheck() would
; fail and the boot would panic.  3087 is this test's own volume -- 3072 is the artifact,
; mdtest owns 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080,
; swap 3081, files 3082, utils 3083, login 3084, multi 3085 and edit 3086.  The volume
; number is the rightmost run of digits in the filename; `attach' scrapes it, so the name
; IS the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with
; EIO.  See boot.ini.in, which says it at length.  They are named for this test because
; ctest runs the SIMH tests in parallel and the others want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3087.disk
attach -n drum0 fsinfo0.drum
attach -n drum1 fsinfo1.drum
load ../unix

expect "# " send after=20000 delay=20000 "sh /etc/fsinfo\r"; step 600000000

expect "fsinfo done" echof "PASS: fsinfo -- the shell ran /etc/fsinfo, which built a tree of known sizes with a hard link across two directories and had du(1) charge for it once, then read the SUPERBLOCK AND THE WHOLE I-LIST off /dev/rmd0 through physio() -- df(1) counting the free list by draining it and quot(1) summing every inode by owner -- and the host now has both to check against figures of its own"; quit

step 600000000

echof "FAIL: fsinfo did not get to the end. If nothing above says `fsinfo done', /etc/fsinfo either never started or never reached its last line: anything it printed to the console is above -- the ---df--- and ---quot--- blocks in particular -- and everything else went to /tmp/fsinfo.log, which run-fsinfo.sh would have extracted had the run got that far. If the ---df--- marker IS above but no number follows it, suspect the RAW READ rather than the arithmetic: an EFAULT out of read(2) on /dev/rmd0 means one of the four alignment rules in cmd/df/README.md is broken, and the buffer's word address is the first thing to look at. PC:"
ex PC
exit 1
