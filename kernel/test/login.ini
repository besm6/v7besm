; MULTI-USER: a getty on each Consul, a password checked by crypt, and the first shell on this
; machine that does not belong to root -- kernel task 29b.
;
; console.ini next door ends where this one begins.  It types at the single-user shell, sends
; ^D, and stops at the `login: ' that /etc/init's merge() puts there; everything after that
; prompt is this file.  What it covers, and nothing else in the suite does:
;
;   /etc/ttys       read by merge() (cmd/init/init.c), which forks an /etc/getty per enabled
;                   line.  Two lines, `console' and `tty1'.  Until 29b that file was not on
;                   the image at all, so merge() returned at the failed open and multiple()
;                   fell straight through -- the single-user loop this port lived in.
;
;   /etc/getty      the modes, the prompt and the name.  It runs the line RAW, so the echo in
;                   the stream below is getty's own and a typed CR appears as a bare CR.
;
;   /bin/login      getpass(), crypt() against /etc/passwd, /etc/utmp, chown() of the
;                   terminal, and setgid()/setuid().  THREE OF THOSE HAD NEVER RUN: nothing on
;                   this image had ever called getpass() or ttyslot(), and nothing had ever
;                   written /etc/utmp.
;
;   multiple()      the respawn loop.  When the login shell exits, init reaps it, blanks the
;                   utmp record and forks a FRESH getty on that line -- and no other test in
;                   this suite reaches that loop, because no other test has a child of init to
;                   put in it.  Stage 8 below is the whole point of the file.
;
;   uid 7           the first non-root process to reach a shell.  cmd/README.md §8 used to say
;                   "every shell today is root's", and lib/test/suidt was the only thing on the
;                   image that made a process that was not.  `$ ' rather than `# ' is the shell
;                   saying so (cmd/sh/main.c picks the prompt off getuid()).
;
; THE PASSWORD IS `besm6' AND IT IS NOT ON THE IMAGE.  /etc/passwd carries the DES hash,
; aQR1E1yZh1bPE, and the plaintext lives here and in cmd/login/README.md.  That hash is not
; invented for this test: it is one of the six vectors lib/test/pwent.c has asserted against
; the host's crypt(3) all along, so if libc's crypt ever drifts, pwent says so before this
; file does.  guest has NO password, which is the other arm of login's `if (*pwd->pw_passwd)' --
; both arms in one dialogue.
;
; BOTH CONSULS ARE CONFIGURED AND ONLY CONSUL 1 IS DRIVEN.  `attach tty25 console' binds
; Consul 1 to the simulator's own stdin/stdout, which is what lets `expect'/`send' work with no
; tty on stdin under ctest.  Consul 2 gets `set tty26 raw' and a telnet listener on port 4199,
; which is what makes it a TERMINAL rather than a discarded line: an unattached Consul still
; cycles READY2 and its ПРП "printing finished" bit -- which is why the driver keeps running
; and why sctest can exercise both typewriters with one console attached -- but vt_puts()
; returns early on an unconnected line, so nothing it prints goes anywhere and nothing typed
; can reach it.  With the listener there, `telnet localhost 4199' during a hand run reaches the
; getty on /dev/tty1 and logs in for real.  Two simulator traps make that work and both are
; fixes rather than workarounds (besm6_tty.c, the tmxr_poll_conn arm): a `raw' set before the
; client connects survives reset_line(), and the '\3' injected into every new connection --
; which on a Consul line arrives at the guest as a typed ^C -- is skipped for a raw line.
;
; `Line=26,' IS NOT DECORATION.  `attach tty26 4199' does NOT bind line 26: tty_attach() hands
; the whole string to tmxr_attach() with the comment "the unit number is ignored for the port
; assignment", so it makes a MUX-WIDE listener, and tmxr_poll_conn() then gives the connection
; to the lowest free line -- line 1, one of the bit-serial lines this guest has no driver for.
; It was written that way here until task 29c ran it and read the simulator's own answer,
; `*** tty1: a new connection'.  With `Line=26,' it says `*** tty26:' and the telnet session is
; the second typewriter.
;
; DRIVING Consul 2 FROM A SCRIPT is multi.ini next door, and it does not use this listener: the
; accept happens in a poll that runs at most once per second of host time, which is after the
; getty has prompted, so that file has the simulator DIAL OUT instead.  A listener is right for
; a human, who can be told to connect and wait; it is not right for a test.
;
; THE PORT NUMBER IS FIXED, which is safe only because every booting test here holds
; RESOURCE_LOCK simh_boot and so never runs beside another.  A second concurrent boot would
; fail to bind it.
;
; EVERY `send' CARRIES `after=20000 delay=20000', AND THE SECOND HALF IS THIS FILE'S OWN
; FINDING.  The `after=' is console.ini's, for the reason that file states at length: a send
; issued straight out of an expect can lose its FIRST character, reproducibly.  The `delay=' --
; the gap between the characters that follow -- is needed HERE and is not needed there, and the
; difference says something about where the drop is.  Without it `nosuch' arrived as `nsuch',
; every run, on an idle machine: the SECOND character, not the first.  What is different about
; this dialogue is that /etc/getty reads the name in RAW mode, one read(2) and one write(2) per
; character from user mode, where every other test types at a shell in canonical mode and the
; kernel accumulates a whole line in a clist before anybody is woken.  scintr() (kernel/dev/sc.c)
; takes ONE character per ПРП interrupt out of a single register, so a character arriving while
; the last one is still unread has nowhere to wait -- and a per-character round trip through
; user mode is exactly the way to make that window wide.  So this is evidence for the guest-side
; half of task 35's question, and it is the first case that distinguishes the two rates: the
; same simulator feeds a shell at the default rate without loss.  It is NOT a proof -- see task
; 35 for what would be -- and 20000 is simply a delay that works, not a measured minimum.
; Put both on any new stage here.
;
; EVERY STAGE'S expect IS THE TAIL OF THE ONE BEFORE, because all the rules are armed at once
; and a prompt on its own is not unique -- there are three `login: ' prompts in this dialogue,
; three `# ' and three `$ '.  What makes each rule unique is written beside it below.  Get
; one wrong and the run does not misbehave, it stalls, and the FAIL at the bottom says where.
; The last rule is subject to that too: `sync\r\n$ ' carries the echo of a command that appears
; nowhere else.  Never end this file on a rule a bare prompt satisfies.
;
; WHAT EACH STAGE PROVES:
;
;   1  ^D at the single-user prompt.  The shell exits, init runs /etc/rc, and merge() reaches
;      /etc/ttys for the first time in this port's life.
;
;   2  `nosuch' -- a name /etc/passwd does not have.  login STILL ASKS FOR A PASSWORD, against
;      the `nouser' entry whose encrypted field is the four characters `nope', which no
;      crypt() output can equal.  That is v7's arrangement and it is deliberate: a login that
;      skipped the prompt would tell a stranger which names exist.
;
;   3  a wrong password.  crypt() rejects it, `Login incorrect' comes back, and login loops --
;      IN THE SAME PROCESS, so the prompt at the end of this stage is login's own printf and
;      not a fresh getty's.  That is why stage 4's echo is the kernel's (ECHO|CRMOD, so a
;      typed CR echoes as CR LF) where stage 2's was getty's own putchr() in RAW -- and why
;      cmd/login/login.c has to fflush() that prompt, this libc's stdout being line buffered
;      on a terminal where v7's was unbuffered.
;
;   5  `root' and the right password.  showmotd() prints /etc/motd -- the second time it
;      appears in this stream, /etc/rc having printed it once already -- and execlp() hands
;      over to /bin/sh with argv[0] `-sh'.  `# ' is uid 0's prompt.
;
;   7  ^D, AND NOT `exit'.  This shell's exit builtin does not leave an interactive top-level
;      shell: exitsh() (cmd/sh/service.c) sees ttyflg without forked or errflg and longjmp()s
;      back to the command loop, so `exit' answers with a fresh prompt.  ^D is how a v7 login
;      shell is left, and it is what the kernel's CEOT delivers as a zero-length read.
;
;   8  THE RESPAWN, and the whole point of the file.  The login shell goes, init's multiple()
;      reaps it, rmut() blanks the utmp record, dfork() puts a NEW getty on the line, and a
;      fresh `login: ' appears.  Nothing else in this suite gets here.
;
;   9  `guest', whose password field is empty: no prompt at all, straight to the motd.  uid 7,
;      gid 3, and `$ '.
;
;  10  `echo $HOME' -> /usr/guest.  login built the environment from scratch (envinit) and
;      chdir()'d there; the directory exists because root.manifest makes it, owned by 7.
;
;  11  `sync', LAST.  There is no update daemon here, so without it the delayed-write buffers
;      holding /etc/utmp and the terminals' new ownership would still be in core when the
;      simulator stops -- and run-login.sh's fsck and mode diff would see none of it.
;
; THE DISK IS A COPY AND IS WRITABLE, at volume 3084 (3083 is utils, the highest before this).
; run-login.sh converts it fresh for every run.  THIS TEST WRITES MORE OF THE ROOT FILESYSTEM
; THAN ANY OTHER: merge() creat()s /etc/utmp, login writes a record into it, and every login
; and logout chown()s a device node.  That is what the host-side half is for.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev and exece() stages the
; argument list there.  See boot.ini.in, which says it at length.
;
; A FAILURE IS TIMEOUT-SHAPED, deliberately: a password that does not match, a getty that never
; prompts, a getlogin that never returns, an init that does not respawn -- each leaves its
; expect unfired and the final `step' runs out.  Where it stopped is the diagnosis; look the PC
; up in ../unix.nm for the kernel, or in build/rootfs/{etc/getty,bin/login}.nm for userland.
; If the terminal path itself is in doubt rather than these two programs, console.ini passes
; without either of them and is the bisection point.

reset
set cpu latin
set mmu cache
set tty25 raw
set tty26 raw

attach tty25 console
attach tty26 Line=26,4199
attach md00 root3084.disk
attach -n drum0 login0.drum
attach -n drum1 login1.drum
load ../unix

; 1 -- the single-user prompt; the only rule in this file that may match a bare prompt.
expect "# " send after=20000 delay=20000 "\004"; step 50000000
; 2 -- the tail of the date /etc/rc prints, then the first getty's prompt.  Unique: nothing
;      else in the stream carries `GMT 2026', and the seconds are left out of the match.
expect "GMT 2026\r\n\r\nlogin: " send after=20000 delay=20000 "nosuch\r"; step 50000000
; 3 -- getty's own RAW echo of the name, then login's getpass prompt.
expect "nosuch\r\nPassword:" send after=20000 delay=20000 "wrongone\r"; step 50000000
; 4 -- the password is not echoed; getpass writes the newline itself.
expect "Login incorrect\r\nlogin: " send after=20000 delay=20000 "root\r"; step 50000000
; 5 -- login's own prompt this time, so the echo is the kernel's: CR comes back as CR LF.
expect "root\r\nPassword:" send after=20000 delay=20000 "besm6\r"; step 50000000
; 6 -- the last line of /etc/motd, printed by showmotd(), then root's shell prompt.
expect "will teach it.\r\n# " send after=20000 delay=20000 "echo root ok\r"; step 50000000
; 7 -- a command run by a shell login started.  THE PROMPT IS DELIBERATELY LEFT OUT of this
;      rule: SIMH clears the match buffer when a rule fires, so the `# ' the shell prints next
;      lands in the fresh buffer and becomes stage 8's prefix -- which is the only thing that
;      makes stage 8 unique, ^D not being echoed.
expect "\r\nroot ok\r\n" send after=20000 delay=20000 "\004"; step 50000000
; 8 -- THE RESPAWN: root's prompt, then nothing (^D is not echoed), then the prompt of a getty
;      that init has just forked.  `# \r\nlogin: ' appears nowhere else -- the first login:
;      follows the date and the third follows `Login incorrect'.
expect "# \r\nlogin: " send after=20000 delay=20000 "guest\r"; step 50000000
; 9 -- no Password: at all, because guest's field is empty.  `$ ' is uid 7's prompt.
expect "will teach it.\r\n$ " send after=20000 delay=20000 "echo $HOME\r"; step 50000000
; 10 -- the environment login built.
expect "\r\n/usr/guest\r\n$ " send after=20000 delay=20000 "sync\r"; step 50000000
; 11 -- sync prints nothing, so this stage is its own echo and the prompt.
expect "sync\r\n$ " echof "PASS: login -- /etc/ttys read, a getty on each Consul, an unknown name asked for a password and refused, root logged in through crypt(3), the shell it got exited and init respawned the getty, and guest logged in with no password to THE FIRST NON-ROOT SHELL ON THIS MACHINE, with the environment login built for it"; quit

step 50000000

echof "FAIL: the login dialogue never completed -- the last expect never fired. See login.ini for what each stage sends and expects, and remember that a stage's expect is the tail of the PREVIOUS stage's output. PC:"
ex PC
exit 1
