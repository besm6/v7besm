; TASK C8's FIVE INSPECTION PROGRAMS ON A RUNNING SYSTEM -- the half b6sim cannot have.
;
; filters.ini is the model, and the argument for taking a boot at all is the same one task
; C5a made and this task inherits: all five of ps, dmesg, iostat, pstat and nice have a b6sim
; half, and it is the larger half -- b6sim answers kctl(2) and both memory devices out of an
; imitation kernel (doc/Aout_Simulator.md SS7).  What that half cannot have is PLURALITY.
; proc[] under the simulator holds ONE live entry, the guest itself; inode, file, text, mount
; and sc are empty on purpose; every tick is billed to dk_time[0]; and the one process's
; p_addr IS uhome, so a ps there always reads the live u-area at UBASE and never takes the
; /dev/mem branch at all.  Six things therefore exist only here, and inspect.sh's header
; lists them: a real kernel printf in msgbuf, four processes, a state of S, a WCHAN worth
; printing, a systm and an idle column with numbers in them, and a u-area at a p_addr that is
; not the caller's.
;
; It boots the same kernel with a WRITABLE copy of the root image, tells the shell to run
; /etc/inspect (kernel/test/inspect.sh), and stops when that script says it is finished.  The
; diff happens on the HOST afterwards; see run-inspect.sh, of which this file is the middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in utils.ini, filters.ini and files.ini.  What
; there is is the step budget, and it is a real one for this script: section 2 puts a
; `sleep 30' in the background so that there is something asleep to look at, and a run that
; never reaches the kill would otherwise sit there.
;
; THE DISK IS ATTACHED WITHOUT -r, because the script writes a dozen intermediate files into
; /tmp and syncs at the end.  root3101.disk is converted out of root.img by run-inspect.sh,
; freshly for every run, with the script grafted in; root3072.disk, the build artifact, is
; never written by anything.  Not `-n' either: that would CREATE AND FORMAT an empty
; container, on which sbcheck() would fail and the boot would panic.
;
; 3101 IS THIS TEST'S OWN VOLUME.  3072 is the artifact, mdtest owns 3073-3076, session 3077,
; console 3078, the coninit graft 3079, libtest 3080, swap 3081, files 3082, utils 3083, login
; 3084, multi 3085, edit 3086, fsinfo 3087, dd 3088, mkfs 3089-3090, fsck 3091-3092, mount
; 3093-3096, filters 3097, accounts 3098 and tar 3099 with a scratch pack at 3100.  The volume
; number is the rightmost run of digits in the filename; `attach' scrapes it, so the name IS
; the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the others want swap areas of their own.  They matter twice
; over here: `pstat -s' prints the swap map, so a run with no drum would print a different
; one.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
;
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3101.disk
attach -n drum0 inspect0.drum
attach -n drum1 inspect1.drum
load ../unix

expect "# " send "sh /etc/inspect\r"; step 400000000
expect "inspect done" echof "PASS: inspect -- the shell ran /etc/inspect, which put task C8's five inspection programs through the booted kernel. What only a boot can say: dmesg printed the four lines the kernel's own printf really put in msgbuf, ps found four or more processes with one of them asleep on a WCHAN it could print, nice set a priority and ps read it back out of the proc table, iostat found system and idle time where b6sim can only ever find user time, pstat found a live inode table, open files, a mounted root and a console that is open with carrier on, and pstat -u read INIT's u-area at a p_addr that is not the caller's -- above KREACH and off /dev/mem, which is the one branch of the whole task the simulator cannot reach"; quit

step 400000000

echof "FAIL: /etc/inspect never finished -- it either never started or never reached its last line. Anything the script printed before stopping is above, and /tmp/inspect.log on the pack holds whatever reached it. Two likely causes: the background `sleep 30' in section 2 was never killed, or one of the five programs stopped on a diagnostic and the shell carried on to a command whose input it never got. See inspect.sh for what it does, and run-inspect.sh for what happens to the disk afterwards. PC:"
ex PC
exit 1
