; dd(1) ON THE RAW DEVICE -- task C4b's "done when", and the first test here whose subject is
; a transfer rather than a filesystem.
;
; fsinfo (volume 3087) reads /dev/rmd0 too, but it reads it the way df(1) and quot(1) do:
; whole blocks, at block-aligned offsets, out of a buffer those two programs align at startup
; because the compiler cannot.  What this one asks is whether a GENERAL-PURPOSE copy program
; can do it -- one whose record size is the user's number rather than a constant -- and it
; asks the complementary question as well, which nothing here had asked before: what happens
; when the record size is WRONG.  cmd/df/README.md is the account of the four conditions;
; run-dd.sh is the host half of this test and dd.sh is the middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in session.ini, files.ini, utils.ini, edit.ini and
; fsinfo.ini.  The twelve cmd_dd_* cases next door cover the command language under b6sim,
; where every misalignment succeeds because the read(2) is the host's.  Everything this file
; boots for is the kernel's half.
;
; THE DISK IS ATTACHED WITHOUT -r, because the script writes what it read.  root3088.disk is
; converted out of root.img by run-dd.sh, freshly for every run, with dd.sh grafted in;
; root3072.disk, the build artifact, is never written by anything.  Not `-n' either: that
; would CREATE AND FORMAT an empty container, on which sbcheck() would fail and the boot would
; panic.  3088 is this test's own volume -- 3072 is the artifact, mdtest owns 3073-3076,
; session 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081, files 3082,
; utils 3083, login 3084, multi 3085, edit 3086 and fsinfo 3087.  The volume number is the
; rightmost run of digits in the filename; `attach' scrapes it, so the name IS the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the others want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3088.disk
attach -n drum0 dd0.drum
attach -n drum1 dd1.drum
load ../unix

expect "# " send "sh /etc/dd\r"; step 600000000

expect "dd done" echof "PASS: dd -- the shell ran /etc/dd, which copied two blocks off /dev/rmd0 through physio() twice over, once with the DEFAULT record size and once through the fast bs= path, then asked for the same blocks with two record sizes the hardware cannot name and got a diagnostic and a non-zero status for each, and finally put 365 bytes of UTF-8 through the EBCDIC tables and back; the host now has all of it to check against the image itself"; quit

step 600000000

echof "FAIL: dd did not get to the end. If nothing above says `dd done', /etc/dd either never started or never reached its last line: everything it produced went to /tmp/dd.log, which run-dd.sh would have extracted had the run got that far. If it stopped in the ---raw--- block, suspect the ALIGNMENT rather than the arithmetic: an EFAULT out of read(2) on /dev/rmd0 means one of the four conditions in cmd/df/README.md is broken, and the word address of the buffer getbuf() stepped up is the first thing to look at. PC:"
ex PC
exit 1
