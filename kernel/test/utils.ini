; THE SMALL UTILITIES ON A RUNNING SYSTEM -- task C2's "done when".
;
; files.ini proved that the file-management set can rearrange a tree.  This one proves the
; three programs of task C2a work where nothing but a real kernel can show it: date(1)
; moving the system clock through stime(2), sleep(1) waiting on an alarm that has to be
; delivered, and kill(1) sending a signal to another process.  b6sim can assert none of the
; three -- its stime() is a no-op, and its kill() is the build machine's own -- so the
; cmd_* cases next door cover the argument handling and this covers the behaviour.
;
; TASK C2b ADDED FIVE MORE and the same division holds: tty(1) answering /dev/console, which
; needs a read(2) on a directory that the simulator refuses; test(1) and its second name `[',
; which needs the hard link on the image; yes(1), which nothing can stop but a SIGPIPE; and
; time(1), which forks, execs and reads times(2).  This is also where THE FIRST PIPELINE this
; image has ever run lives -- nothing in kernel/test/ or cmd/sh/test/ had used `|' before.
;
; It boots the same kernel with a WRITABLE copy of the root image, tells the shell to run
; /etc/utils (kernel/test/utils.sh), and stops when that script says it is finished.  The
; diff happens on the HOST afterwards; see run-utils.sh, of which this file is the middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in session.ini and files.ini -- with ONE
; exception that is worth stating, because it is the only place it can be made: the step
; budget IS the kill assertion.  utils.sh backgrounds a `sleep 60' and kills it, then waits.
; A kill that did nothing leaves the shell in wait() for sixty guest seconds, the budget
; runs out, and the run fails as a hang.  A kill that worked returns at once.
;
; THE DISK IS ATTACHED WITHOUT -r, because date(1) changes the clock and the sync at the end
; of the script writes it into the superblock.  root3083.disk is converted out of root.img
; by run-utils.sh, freshly for every run, with the script grafted in; root3072.disk, the
; build artifact, is never written by anything.  Not `-n' either: that would CREATE AND
; FORMAT an empty container, on which sbcheck() would fail and the boot would panic.  3083
; is this test's own volume -- 3072 is the artifact, mdtest owns 3073-3076, session 3077,
; console 3078, the coninit graft 3079, libtest 3080, swap 3081 and files 3082.  The volume
; number is the rightmost run of digits in the filename; `attach' scrapes it, so the name IS
; the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the others want swap areas of their own.
;
; `set mmu cache' and `set tty25 raw8' for the reasons boot.ini.in and console.ini give.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw8

attach tty25 console
attach md00 root3083.disk
attach -n drum0 utils0.drum
attach -n drum1 utils1.drum
load ../unix

expect "# " send after=20000 delay=20000 "sh /etc/utils\r"; step 400000000
expect "utils done" echof "PASS: utils -- the shell ran /etc/utils, which moved the clock with date, waited on an alarm with sleep, killed a background process, branched on test through both its names, named its terminal with tty, stopped yes with a SIGPIPE down the first pipeline this image has run, timed a command with time, and carried UTF-8 through argv and through filename generation"; quit

step 400000000

echof "FAIL: /etc/utils never finished -- it either never started or never reached its last line. The likeliest cause is the kill block: a signal that was not delivered leaves the shell waiting sixty guest seconds on the background sleep, which is more than this budget. Anything the script printed before stopping is above. See utils.sh for what it does, and run-utils.sh for what happens to the disk afterwards. PC:"
ex PC
exit 1
