; ed(1) ON A RUNNING SYSTEM -- task C3's "done when", and the point at which this machine
; can produce text of its own.
;
; Every file on the disk image was written on the build host and staged in by b6fsutil.  This
; is the test that says the guest no longer needs it: the shell runs /etc/edit
; (kernel/test/edit.sh), which authors a file from nothing, edits files that cat wrote, reads
; and rewrites the one file on this image that v7's ed would have REFUSED -- /etc/motd, 365
; bytes of UTF-8 -- and works ed's own 512-byte temp-file pager against a real disk.  The
; diffs and the two byte-for-byte cmps happen on the HOST afterwards; see run-edit.sh, of
; which this file is the middle.
;
; SO THERE IS ALMOST NO ASSERTION HERE, as in session.ini, files.ini and utils.ini.  The
; nineteen cmd_ed_* cases next door cover the command language and the regex engine under
; b6sim, on the same staged bytes, in a fraction of a second each; what needs a kernel is
; only what edit.sh's header lists, and the questions worth asking about it are all questions
; about a filesystem, which is where run-edit.sh asks them.
;
; THE DISK IS ATTACHED WITHOUT -r, because the whole test is about writing.  root3086.disk is
; converted out of root.img by run-edit.sh, freshly for every run, with edit.sh grafted in;
; root3072.disk, the build artifact, is never written by anything.  Not `-n' either: that
; would CREATE AND FORMAT an empty container, on which sbcheck() would fail and the boot
; would panic.  3086 is this test's own volume -- 3072 is the artifact, mdtest owns
; 3073-3076, session 3077, console 3078, the coninit graft 3079, libtest 3080, swap 3081,
; files 3082, utils 3083, login 3084 and multi 3085.  The volume number is the rightmost run
; of digits in the filename; `attach' scrapes it, so the name IS the volume.
;
; THE DRUMS MUST BE ATTACHED TO EXEC ANYTHING -- they are swapdev, and exece() stages the
; argument list there before it touches the new image; with no drum the exec fails with EIO.
; See boot.ini.in, which says it at length.  They are named for this test because ctest runs
; the SIMH tests in parallel and the others want swap areas of their own.  This script execs
; more programs than any other here: a fresh ed per here-document, plus the /bin/sh that ed's
; `!' forks, so the drum is on the hot path throughout.
;
; `set mmu cache' and `set tty25 raw' for the reasons boot.ini.in and console.ini give.
; `step', not `go': a hang must fail the run instead of hanging it.

reset
set cpu latin
set mmu cache
set tty25 raw

attach tty25 console
attach md00 root3086.disk
attach -n drum0 edit0.drum
attach -n drum1 edit1.drum
load ../unix

expect "# " send "sh /etc/edit\r"; step 600000000

; THE SECOND STAGE IS TYPED, and it is here rather than in a test of its own because it needs
; no second boot and asserts something the script above cannot.  Everything /etc/edit does
; reaches ed through a here-document -- which is a FILE -- so nothing so far has driven this
; editor from a TERMINAL.  Two things are only visible that way:
;
;   * getchr() reading a byte at a time from the Consul through the clists, Cyrillic included,
;     rather than from a disk file;
;
;   * error() calling lseek(0, 0, SEEK_END).  On a file that seek succeeds and throws away the
;     rest of the script, which is what makes `one error per case' the rule next door
;     (cmd/ed/test/CMakeLists.txt).  On a TTY it fails, harmlessly, and the editor must go on
;     reading what is typed after the `?'.  The `1,$p' below is what says it did: a `?' that
;     had killed the session, or an lseek that had eaten the next line, would leave this expect
;     unmatched and the run would fail on its step budget.
;
; IT DELIBERATELY WRITES NOTHING.  The dialogue ends with `Q', which discards the buffer, so
; the three host-side oracles in run-edit.sh see exactly what /etc/edit left them -- this stage
; is asserted entirely by the expect chain, which is an assertion: every string here has to
; match in order or the run fails.
expect "edit done" send after=20000 "ed\r"; step 60000000
expect "ed\r\n" send after=20000 "a\r"; step 20000000
expect "a\r\n" send after=20000 "привет\r"; step 30000000
expect "привет\r\n" send after=20000 ".\r"; step 20000000
expect ".\r\n" send after=20000 "Z\r"; step 20000000
expect "?\r\n" send after=20000 "1,$p\r"; step 30000000
expect "привет\r\n" send after=20000 "Q\r"; step 40000000

expect "# " echof "PASS: edit -- the shell ran /etc/edit, which authored a file from nothing, edited two that cat had written, read and rewrote /etc/motd's 365 bytes of UTF-8 through ed's own 512-byte temp-file pager, substituted Cyrillic into a file three times that size, matched Cyrillic patterns, and forked a shell out of ed's `!' -- and then a typed dialogue drove the same editor from the Consul, in Cyrillic, and survived a `?' on a descriptor no lseek can move"; quit

step 600000000

echof "FAIL: edit did not get to the end. If nothing above says `edit done', /etc/edit either never started or never reached its last line: anything it printed to the console is above, and everything else went to /tmp/edit.log, which run-edit.sh would have extracted had the run got that far -- if that log's first line `edit start' is the only thing in it, suspect the here-documents, this being the first test to run one under the booted kernel (the shell writes each to /tmp/sh-<pid> and unlinks it, cmd/sh/io.c). If `edit done' IS above, the typed second stage is what stopped: see the comment on it in this file. PC:"
ex PC
exit 1
