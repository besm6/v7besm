; Run the Unix kernel on the SIMH BESM-6 simulator (`make run').
;
; Boots the freshly-linked `unix' image the way test/boot.ini does, but for a human:
; besm6.S:_start seeds the kernel stack pointer and calls main(), which sizes memory,
; mounts the root, hands process 1 the icode and returns -- and _start's second half
; turns that return into the first entry into user mode.  You should see startup()'s
; three lines, iinit()'s root size, and then a prompt:
;
;       phys mem  = 3072 kbytes
;       user mem  = 2874 kbytes
;       swap size = 3072 kbytes
;       root size = 6000 kbytes
;       # _
;
; THAT IS A SHELL -- S. R. Bourne's, cmd/sh, exec'd by /etc/init (cmd/init) which the icode
; exec'd in turn.  `# ' rather than `$ ' because you are uid 0.  Type at it: /bin/cat,
; /bin/echo, /bin/ls, /bin/pwd and /bin/sync are what is on the image, and `ls /bin' will
; say so.  The line editing is the KERNEL's, not the shell's -- `#' erases a character and
; `@' kills the line (the v7 defaults, sys/tty.h), both done by canon().
;
; ^D ENDS THE SHELL, and is worth doing once: init wakes from its wait(), runs /etc/rc
; through a second shell, the motd appears, and then it comes round to a fresh prompt.  That
; whole cycle -- through process 1 and back -- is what kernel/test/console asserts.
;
; To stop: ^E gets you the sim> prompt, and `quit' ends the run.  There is no shutdown and
; nothing calls sync(2) for you, so if you have written files, type `sync' first.
;
; (bss need not be cleared here: SIMH starts every word at zero -- see the ON_SIMH guard
; in kernel/machdep.c.)
;
; THE ROOT DISK IS ATTACHED, and must be: with no md00 the boot panics in iinit().  It is
; the image kernel/test builds (`make tests' or `make test'), which is why the path points
; into the test build directory.
;
; IT IS ATTACHED WRITABLE, unlike the one kernel/test/boot uses, because a human at a prompt
; will want to create a file.  That means an interactive session DIRTIES A BUILD ARTIFACT --
; harmless, since `make tests' rebuilds root3072.disk from root.manifest, but do not keep
; anything on it.  The tests never write this image: each that needs to convert its own copy
; at its own volume number (kernel/test/CMakeLists.txt).
;
; THE DRUMS ARE ATTACHED, and must be: they are swapdev (kernel/conf.c), and exece() stages
; the argument list in swap before it touches the new image.  With no drum that comes back
; B_ERROR and every exec fails with `exec init: error 5' (EIO).  `-n' creates them empty,
; which is what a scratch swap area wants.
;
; `set mmu cache' models the БРЗ write-back properly, and the boot now needs it modelled:
; it programs РП (estabur -> sureg) and writes user memory through the map (copyout).  A
; kernel that only worked with the cache off would not have worked on the real machine.
;
; The console is bound to the SIMH console in raw mode, so the kernel's output appears on
; stdout unchanged.  `reset' first re-arms the terminal clock that the polled console
; putchar() waits on (see kernel/test/hello.ini for why).

reset
set cpu latin
set mmu cache
set tty25 raw

; Uncomment to trace every instruction into unix.trace (`set cpu debug' emits the
; detailed per-instruction trace; `set debug' routes it to a file).
;set debug "unix.trace"
;set cpu debug

attach tty25 console
attach md00 test/root3072.disk
attach -n drum0 unix0.drum
attach -n drum1 unix1.drum
load unix
go
quit
