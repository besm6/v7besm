; date.ini -- the operator typing the date at the single-user prompt.  An `expect' ACTION,
; never a command of its own; %* is the caller's resume command:
;
;       expect "# " do date.ini go                  unix.ini, beside this file
;       expect "# " do ../date.ini step 50000000    test/multi.ini
;
; A nested file because SCP substitutes %VAR% when it READS a line, so a send written into
; the rule would carry the time the .ini was parsed.  README.md, "Telling it the date".
send after=20000 delay=20000 "date %DATE_YY%%DATE_MM%%DATE_DD%%TIME_HH%%TIME_MM%\r"
%*
